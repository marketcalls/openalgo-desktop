# Weekly dependency updates, grouped so a week produces a handful of PRs
# instead of dozens. Security updates are not grouped and arrive as soon as an
# advisory is published.
#
# The tauri crate (cargo) and @tauri-apps/* (npm) must stay on the same
# major.minor. Dependabot cannot group across ecosystems, so merge the two
# "tauri" PRs together.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, rust]
    # Major bumps (aes-gcm, argon2, rand, keyring, axum...) change crypto and
    # server APIs; they are taken deliberately, not from a weekly PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, javascript]
    # The frontend tracks OpenAlgo web's versions; majors arrive with web updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @openuidev/* is 0.x, where a "minor" is a breaking release. The web
      # pins react-headless 0.9, react-lang 0.2 and react-ui 0.13, and the Agent
      # prompt generated from them must fit AGENT_UI_PROMPT_MAX_CHARS
      # (src/lib/agent/openuiLibrary.ts). 0.17 / 0.3 grew it from under 8800 to
      # 10088 characters and failed openuiLibrary.test.ts (PR #29). Take these
      # with the web's own upgrade or when the Agent is built, not from a weekly
      # PR. Patch releases still come through.
      - dependency-name: "@openuidev/*"
        update-types: ["version-update:semver-minor"]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      react:
        patterns: ["react", "react-dom", "react-router", "react-router-*", "@types/react", "@types/react-dom"]
      test-tooling:
        dependency-type: development
        patterns: ["vitest", "@vitest/*", "@playwright/test", "playwright", "jsdom", "@testing-library/*", "jest-axe", "@types/jest-axe"]
      build-tooling:
        dependency-type: development
        patterns: ["vite", "@vitejs/*", "typescript", "@biomejs/*", "tailwindcss", "@tailwindcss/*"]
      npm-dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
