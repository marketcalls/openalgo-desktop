# cargo-deny configuration for src-tauri.
#
# Lives in .github/ (not the repo root) so CI owns it. Every scan runs
# through scripts/ci/advisory_scan.sh (the release gate, security.yml and
# scripts/release/preflight.sh alike); run `scripts/ci/advisory_scan.sh
# cargo-deny` locally before adding a dependency.
#
# RUSTSEC ids listed under [advisories].ignore are also ignored by
# cargo-audit (the same script greps this file), so this is the single
# place an advisory is accepted. Every ignore needs a reason, the date it was
# accepted (and last re-checked) and a review date; the dispositions are
# recorded in docs/audit/<date>/ (latest: docs/audit/2026-10-22/scanner-triage.md).

[graph]
# Only the platforms we ship. Prunes Android/iOS/wasm-only crates from every
# check so they cannot fail the build.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
# Vulnerability advisories always fail. Unmaintained and unsound notices fail
# only for crates we depend on directly; transitive ones (for example the gtk-rs
# GTK3 bindings pulled in by Tauri on Linux) are reported by cargo-audit's JSON
# artifact instead of breaking the build.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
  # rustls-webpki 0.102.8 via rumqttc: the 0.102 verifier is never called.
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 comes only from rumqttc 0.25.1 (IIFL Capital feed), which pins ^0.102.8 even on its main branch. rumqttc only names webpki::Error; the feed passes TlsConfiguration::Rustls with our own rustls 0.23 config, which verifies with the patched rustls-webpki 0.103.16 (mqtt_relay.rs tls_config). Remove when rumqttc moves to 0.103. Accepted 2026-10-08; re-checked 2026-10-22 (rumqttc 0.25.1 is still the latest release and its main branch still pins 0.102.8); review by 2027-01-31" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8 comes only from rumqttc 0.25.1 (IIFL Capital feed), which pins ^0.102.8 even on its main branch. rumqttc only names webpki::Error; the feed passes TlsConfiguration::Rustls with our own rustls 0.23 config, which verifies with the patched rustls-webpki 0.103.16 (mqtt_relay.rs tls_config). Remove when rumqttc moves to 0.103. Accepted 2026-10-08; re-checked 2026-10-22 (rumqttc 0.25.1 is still the latest release and its main branch still pins 0.102.8); review by 2027-01-31" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8 comes only from rumqttc 0.25.1 (IIFL Capital feed), which pins ^0.102.8 even on its main branch. rumqttc only names webpki::Error; the feed passes TlsConfiguration::Rustls with our own rustls 0.23 config, which verifies with the patched rustls-webpki 0.103.16 (mqtt_relay.rs tls_config). Remove when rumqttc moves to 0.103. Accepted 2026-10-08; re-checked 2026-10-22 (rumqttc 0.25.1 is still the latest release and its main branch still pins 0.102.8); review by 2027-01-31" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8 comes only from rumqttc 0.25.1 (IIFL Capital feed), which pins ^0.102.8 even on its main branch. rumqttc only names webpki::Error; the feed passes TlsConfiguration::Rustls with our own rustls 0.23 config, which verifies with the patched rustls-webpki 0.103.16 (mqtt_relay.rs tls_config). Remove when rumqttc moves to 0.103. Accepted 2026-10-08; re-checked 2026-10-22 (rumqttc 0.25.1 is still the latest release and its main branch still pins 0.102.8); review by 2027-01-31" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 comes only from rumqttc 0.25.1 (IIFL Capital feed), which pins ^0.102.8 even on its main branch. rumqttc only names webpki::Error; the feed passes TlsConfiguration::Rustls with our own rustls 0.23 config, which verifies with the patched rustls-webpki 0.103.16 (mqtt_relay.rs tls_config). Remove when rumqttc moves to 0.103. Accepted 2026-10-22; re-checked 2026-10-22 (rumqttc 0.25.1 is still the latest release and its main branch still pins 0.102.8); review by 2027-01-31" },
]

[licenses]
# OpenAlgo Desktop is AGPL-3.0. Everything below is AGPL-compatible.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
# Our own crate(s) with publish = false are not license-checked.
ignore = true

[bans]
# Tauri pulls several majors of windows-sys, syn, bitflags and friends; report
# duplicates without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
# A git dependency must be added to allow-git explicitly, with the reason in
# the PR description.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # WhatsApp client (MIT), pinned by commit in src-tauri/Cargo.toml: the crate
  # the web's `wars` package wraps; not published to crates.io at that commit.
  "https://github.com/marketcalls/whatsapp-rust",
  # oa_core (MIT, no dependencies), the Rust core of openalgo.ta, pinned by
  # commit in src-tauri/Cargo.toml to tag v2.0.5, the openalgo release the
  # web pins: the Agent's indicator kernels. Not published to crates.io.
  "https://github.com/marketcalls/openalgo-python-library",
]
