name: Native E2E (test build)

# The app driven through its own window on Linux and Windows, against its
# real Rust server, sign-in and session cookie (scripts/ci/native_e2e.py):
# account creation, a refused wrong password, sign-in, the signed-in shell,
# a sandbox order and sign-out. The sandbox order
# (scripts/ci/native_e2e_sandbox.py): log in to a scripted broker with its
# saved keys, check the API key is there, switch to analyzer mode, place the ATM
# call from the Option Chain's order form, find it in the Order Book with a
# sandbox order id, read it through /api/v1/orderbook in the web's
# analyze-mode shape, and show by the scripted broker's own count (read out
# at the test build's GET /e2e/scripted-broker) that no order reached it.
#
# Both need a test build (src-tauri/src/e2e.rs), built here with the e2e
# profile (the release settings without link-time optimization):
#   - e2e-broker: a scripted broker (src-tauri/src/brokers/scripted.rs) in
#     the place of Dhan (Sandbox), quoting a small NIFTY market;
#   - e2e-debug-port (Windows): msedgedriver reaches WebView2 through its
#     remote debugging port, and WebView2 does not take that switch from the
#     environment for an app that sets its own browser arguments, as Tauri
#     does. The main window opens the port the script gives it at start
#     (OPENALGO_E2E_DEBUG_PORT, a free port per run), on 127.0.0.1 only,
#     which the script checks.
# That build:
#   - exists only here: neither feature compiles without
#     OPENALGO_E2E_BUILD=1 outside a debug build (the Linux job shows it:
#     the same build without the variable must fail on the guard), and
#     release.yml never sets either;
#   - changes nothing else: the lint job runs the tests that pin the broker
#     catalogue, the sign-in table and which adapter fills each slot with
#     the feature on;
#   - is never shipped: the install smoke and release.yml check every
#     shipped binary for its strings (scripts/ci/check_no_e2e_build.py), and
#     these jobs run the same check on their own builds to show it finds
#     them.
#
# Not part of ci-ok: it builds a second binary per system, so it runs
# after pushes to master, by hand, and on pull requests that change the
# harness itself (the paths below). The release gate requires it green on
# the tagged commit (a run for a push to master or by hand on master;
# scripts/ci/smoke_gate.py), so the native order journey is release
# evidence. Every pull request runs
# the scripted market through the same routes in-process
# (src-tauri/tests/it/e2e_scripted_broker.rs) and the installed .deb's
# sign-in through native-e2e.yml.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - .github/workflows/native-e2e-test-build.yml
      - scripts/ci/native_e2e.py
      - scripts/ci/native_e2e_sandbox.py
      - scripts/ci/check_no_e2e_build.py
      - src-tauri/build.rs
      - src-tauri/src/e2e.rs
      - src-tauri/src/brokers/scripted.rs
  workflow_dispatch:

permissions:
  contents: read

# A release needs this workflow green on its exact commit
# (scripts/ci/smoke_gate.py), so on master every commit gets its own run:
# a newer push never cancels or replaces an older one. Elsewhere the newest
# run of a branch wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  NODE_VERSION: "22"

jobs:
  lint:
    # What only the test build compiles (src-tauri/src/e2e.rs), held to the
    # same clippy as the rest (CI's rust-lint builds without the features),
    # and the tests that show the feature changes no other adapter, the
    # broker catalogue or the sign-in table, and adds only its count route
    # (every pull request runs the same tests without the feature).
    name: clippy and catalogue tests (e2e-broker)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - name: Frontend dist placeholder
        run: mkdir -p dist && test -f dist/index.html || echo '<!doctype html><title>ci</title>' > dist/index.html
      - name: cargo clippy --features e2e-broker
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked --features e2e-broker -- -D warnings
      - name: The catalogue, the sign-in table, the slots and the routes with the feature on
        # Each pin by its full name (--exact) or module, and the number of
        # tests it must run: a renamed or moved test fails here instead of
        # silently guarding nothing.
        working-directory: src-tauri
        run: |
          set -euo pipefail
          pin() {
            # $1: the least number of tests that must pass; then libtest arguments.
            local want="$1"; shift
            cargo test --locked --features e2e-broker --lib -- "$@" 2>&1 | tee "$RUNNER_TEMP/pins.log" | grep -E '^test result'
            local passed
            passed=$(grep -Eo 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/pins.log" | grep -Eo '[0-9]+' | head -1 || true)
            if [ -z "$passed" ] || [ "$passed" -lt "$want" ]; then
              echo "::error title=E2E pins::'$*' ran ${passed:-0} tests, at least $want expected."
              exit 1
            fi
          }
          pin 1 --exact tests::only_the_test_build_puts_the_scripted_broker_in_its_slot
          pin 1 --exact server::routes::e2e::tests::only_the_test_build_has_the_count_route
          pin 1 --exact server::tests::the_scripted_broker_count_is_only_in_the_test_build_and_only_for_the_user
          pin 1 --exact server::tests::public_route_list_is_exactly_the_reviewed_one
          pin 1 --exact server::tests::every_user_route_rejects_without_a_signed_in_session
          pin 1 --exact brokers::tests::registry_shares_one_symbol_master
          pin 21 brokers::catalog::
          pin 3 brokers::setup_guide::
          pin 2 server::tests::sign_in::
          pin 4 brokers::scripted::
  linux:
    name: native e2e (linux x86_64, test build)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/tested_commit.sh
      - uses: ./.github/actions/linux-tauri-deps
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the frontend the binary embeds
        run: npx vite build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Build the E2E test binary (e2e-broker)
        working-directory: src-tauri
        env:
          OPENALGO_E2E_BUILD: "1"
        run: cargo build --profile e2e --locked --features e2e-broker
      - name: The string check finds the test build
        run: python3 scripts/ci/check_no_e2e_build.py src-tauri/target/e2e/openalgo-desktop --expect-e2e
      - name: Install Xvfb, WebKitWebDriver, tauri-driver and selenium
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb webkit2gtk-driver
          command -v WebKitWebDriver
          cargo install tauri-driver --locked --version 2.1.0
          python3 -m pip install --user selenium==4.27.1
      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb did not start within 10 s."
            exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Set up, sign in, place a sandbox order and sign out in the app's window
        run: python3 scripts/ci/native_e2e.py --sandbox-order src-tauri/target/e2e/openalgo-desktop
      - name: Without OPENALGO_E2E_BUILD the same build does not compile
        # The guard in src-tauri/lib.rs: with no debug assertions (the e2e
        # profile inherits the release profile's), the e2e features stop the
        # build unless CI asked for them. Only the app crate is built again.
        working-directory: src-tauri
        run: |
          set -uo pipefail
          if cargo build --profile e2e --locked --features e2e-broker > "$RUNNER_TEMP/guard.log" 2>&1; then
            echo "::error title=E2E guard::The e2e-broker feature built without OPENALGO_E2E_BUILD=1."
            exit 1
          fi
          if ! grep -q "only for CI's native E2E test build" "$RUNNER_TEMP/guard.log"; then
            tail -40 "$RUNNER_TEMP/guard.log"
            echo "::error title=E2E guard::The build failed, but not on the guard."
            exit 1
          fi
          grep -m1 "e2e-debug-port and e2e-broker features" "$RUNNER_TEMP/guard.log" || true
          echo "OK: without OPENALGO_E2E_BUILD=1 the build stops on the guard."
      - name: What the window showed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-e2e-linux-failure
          path: ${{ runner.temp }}/native-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: native e2e (windows-2025, test build)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/tested_commit.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the frontend the binary embeds
        run: npx vite build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
      - name: Build the E2E test binary (e2e-debug-port, e2e-broker)
        working-directory: src-tauri
        env:
          OPENALGO_E2E_BUILD: "1"
          # With .cargo/config.toml's static C runtime, which RUSTFLAGS
          # would otherwise replace: the window under test links as shipped.
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
        run: cargo build --profile e2e --locked --features e2e-debug-port,e2e-broker --target x86_64-pc-windows-msvc
      - name: The string check finds the test build
        run: python scripts/ci/check_no_e2e_build.py src-tauri/target/x86_64-pc-windows-msvc/e2e/openalgo-desktop.exe --expect-e2e
      - name: The test build needs only DLLs that Windows ships
        run: python scripts/ci/check_windows_dlls.py src-tauri/target/x86_64-pc-windows-msvc/e2e/openalgo-desktop.exe
      - name: The Edge WebDriver of the installed WebView2's version
        # msedgedriver must match the WebView2 runtime the app runs in.
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = $null
          foreach ($k in $keys) {
            if (Test-Path $k) { $version = (Get-ItemProperty -Path $k -Name pv -ErrorAction SilentlyContinue).pv }
            if ($version) { break }
          }
          if (-not $version) { throw "The WebView2 runtime version was not found in the registry." }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $driver = Get-ChildItem -Path $dir -Recurse -Filter 'msedgedriver.exe' | Select-Object -First 1
          if (-not $driver) { throw "msedgedriver.exe was not in the download." }
          "MSEDGEDRIVER=$($driver.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install selenium
        run: python -m pip install --user selenium==4.27.1
      - name: Set up, sign in, place a sandbox order and sign out in the app's window
        run: python scripts/ci/native_e2e.py --sandbox-order src-tauri/target/x86_64-pc-windows-msvc/e2e/openalgo-desktop.exe
      - name: What the window showed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-e2e-windows-failure
          path: ${{ runner.temp }}/native-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 7
