name: CI

# Job graph
#
#   rust-lint --> rust-test (ubuntu x64, ubuntu arm64, macos, windows) --+
#             \-> rust-coverage (line-coverage ratchet, a gate)           |
#   frontend (biome, tsc, vite build) -----------------------------------+--> tauri-build (5 targets)
#   frontend-test (node 20/22/24, coverage thresholds) ------------------+
#   tauri-build --> install-smoke (install, start, sign in: Linux x64 and
#               |   arm64, Windows Server 2022 and 2025, macOS)
#               \-> native-e2e (the installed app's window by WebDriver)
#   (a release ships tauri-build's bundles of its master run, signed for
#   in-app updates by release.yml, not rebuilt: scripts/ci/release_bundles.py)
#   e2e (Playwright against vite preview)
#   e2e-flow (Flow's journeys in Playwright against the real Rust server:
#             e2e-flow.yml)
#   secret-scan (gitleaks, full history)
#   code-health (size, dead code and suppression ratchet; CLAUDE.md "Code health")
#
#   ci-ok needs every job above and fails unless all of them succeeded.
#   Branch protection should require only the "ci-ok" check
#   (docs/release/branch-protection.md), and release.yml refuses to build a
#   tag whose commit has no successful ci-ok.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every main run finish so caches get saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across CI runs and bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # Keep line numbers in backtraces but drop full debuginfo: smaller target
  # dirs, faster links and caches that fit the 10 GB repository budget.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- Rust
  rust-lint:
    name: rust-lint (fmt + clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Frontend dist placeholder
        # tauri::generate_context!() embeds frontendDist at compile time; an
        # empty dist/ is enough for clippy and keeps Node out of this job.
        run: mkdir -p dist && test -f dist/index.html || echo '<!doctype html><title>ci</title>' > dist/index.html
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: rust-lint-ubuntu-22.04
          cache-on-failure: true
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  rust-test:
    name: rust-test (${{ matrix.os }})
    needs: rust-lint
    runs-on: ${{ matrix.os }}
    # Cold DuckDB (bundled C++) + SQLite builds take 20-40 minutes, longest on
    # Windows; warm-cache runs are a few minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    env:
      # RUSTFLAGS replaces .cargo/config.toml's rustflags, so Windows repeats
      # its static C runtime and the tests run the build that ships. ARM64
      # Linux links its debug test binaries with lld: they have outgrown
      # AArch64's 128 MiB direct-branch range, which GNU ld cannot bridge
      # there ("relocation truncated to fit: R_AARCH64_CALL26"); lld inserts
      # range-extension thunks.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || matrix.os == 'ubuntu-22.04-arm' && '-D warnings -C link-arg=-fuse-ld=lld' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-tauri-deps
      # The linker for the ARM64 debug test binaries (RUSTFLAGS above),
      # through apt-cached like the other packages: the deps step may
      # install from cached files without updating apt's lists, so a bare
      # apt-get install here could find no lld.
      - if: matrix.os == 'ubuntu-22.04-arm'
        name: lld for the ARM64 test binaries
        uses: ./.github/actions/apt-cached
        with:
          name: lld
          packages: lld
          minutes: "10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Frontend dist placeholder
        run: mkdir -p dist && test -f dist/index.html || echo '<!doctype html><title>ci</title>' > dist/index.html
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: rust-test-${{ matrix.os }}
          cache-on-failure: true
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      - name: Unit and integration tests (nextest)
        working-directory: src-tauri
        run: cargo nextest run --locked --all-targets --config-file ../.github/nextest.toml --profile ci
      - name: Doc tests (nextest does not run them)
        working-directory: src-tauri
        run: cargo test --locked --doc
      - name: KEY-01 keys without the OS keychain, on this system
        # Maintainer decision 2026-10-13: no OS keychain on any platform
        # (macOS Keychain, Windows Credential Manager, Linux Secret Service
        # alike). The key vault's acceptance tests by name,
        # each listed in the log; the step fails if none match. They use an
        # in-memory stand-in for the keychain that counts every call; no
        # test touches the runner's real keychain.
        working-directory: src-tauri
        run: >-
          cargo nextest run --locked --lib --config-file ../.github/nextest.toml
          --profile key01 --no-tests=fail
          -E 'test(/^server::tests::key_vault::/) | test(/^security::tests::/)
          | test(/^security::keystore::tests::/) | test(/^security::window::tests::/)
          | test(/^db::sqlite::key_vault::/) | test(=error::tests::key_and_os_errors_never_reach_an_answer)
          | test(/^server::tests::credentials_lifecycle::sec0[234]/)
          | test(=db::sqlite::data_migrations::tests::upgrade_from_previous_build_keeps_every_secret_readable)
          | test(/^cache::tests::/) | test(/^services::apikey_service::tests::/)'
      - name: Flow triggers leak nothing, measured alone
        # Decision 27 (T-111, X-346): the fd-audit measurement, activating
        # and deactivating every trigger kind 100 times, in its own step
        # and process with nothing else running, so the descriptor, task
        # and RSS counts are its own. Ignored in the full suite for that
        # reason. Windows has no /dev/fd or ps, so there it checks the
        # registrations and tasks only. It runs even when the full suite
        # failed, so the measurement is always in the log.
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: >-
          cargo nextest run --locked --lib --config-file ../.github/nextest.toml
          --run-ignored only --no-tests=fail --no-capture
          -E 'test(=server::tests::flow_triggers::triggers_do_not_leak)'
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-junit-${{ matrix.os }}
          path: |
            src-tauri/target/nextest/ci/junit.xml
            src-tauri/target/nextest/key01/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  rust-coverage:
    name: rust-coverage (llvm-cov)
    needs: rust-lint
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - name: Frontend dist placeholder
        run: mkdir -p dist && test -f dist/index.html || echo '<!doctype html><title>ci</title>' > dist/index.html
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: rust-coverage-ubuntu-22.04
          cache-on-failure: true
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Run tests with coverage instrumentation
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --all-targets --no-fail-fast --no-report
      - name: Build coverage reports
        id: report
        working-directory: src-tauri
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Coverage summary
        working-directory: src-tauri
        run: |
          lines=$(jq -r '.data[0].totals.lines.percent' coverage-summary.json)
          functions=$(jq -r '.data[0].totals.functions.percent' coverage-summary.json)
          regions=$(jq -r '.data[0].totals.regions.percent' coverage-summary.json)
          {
            echo "### Rust coverage (src-tauri)"
            echo
            echo "| Metric | Percent |"
            echo "| --- | --- |"
            printf '| Lines | %.2f |\n' "$lines"
            printf '| Functions | %.2f |\n' "$functions"
            printf '| Regions | %.2f |\n' "$regions"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage ratchet against .github/coverage-baseline.txt
        # A hard gate: line coverage more than 0.1 points below the baseline
        # fails this job and with it ci-ok.
        run: |
          current=$(jq -r '.data[0].totals.lines.percent' src-tauri/coverage-summary.json)
          baseline=$(grep -Ev '^[[:space:]]*(#|$)' .github/coverage-baseline.txt | head -n1 | tr -d '[:space:]')
          printf 'Line coverage: %.2f%% (baseline %s%%)\n' "$current" "$baseline"
          if awk -v c="$current" -v b="$baseline" 'BEGIN { exit !(c + 0.1 < b) }'; then
            echo "::error title=Coverage ratchet::Line coverage ${current}% is below the baseline ${baseline}% in .github/coverage-baseline.txt"
            exit 1
          fi
          if awk -v c="$current" -v b="$baseline" 'BEGIN { exit !(c >= b + 1) }'; then
            echo "::notice title=Coverage ratchet::Line coverage ${current}% is at least 1 point above the baseline ${baseline}%; raise .github/coverage-baseline.txt"
          fi
      - name: Coverage floors of the critical areas (.github/coverage-areas.json)
        # A gate like the ratchet: the order path, sandbox, strategies,
        # scalping, risk rules, security and the other listed areas each
        # keep their own line-coverage floor, so a fall there cannot hide
        # behind a rise elsewhere.
        if: always() && steps.report.outcome == 'success'
        run: python3 scripts/ci/coverage_areas.py src-tauri/coverage-summary.json
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            src-tauri/lcov.info
            src-tauri/coverage-summary.json
            src-tauri/coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------ Frontend
  frontend:
    name: frontend (biome, tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Release and install-smoke gate tests
        # scripts/ci/smoke_gate.py decides which install smoke runs a
        # release may rely on, and release_bundles.py which CI bundles it
        # ships; their tests use fabricated API answers.
        run: |
          python3 scripts/ci/test_smoke_gate.py
          python3 scripts/ci/test_release_bundles.py
      - name: Update manifest tests
        # scripts/ci/updater_manifest.py builds a release's latest.json.
        run: python3 scripts/ci/test_updater_manifest.py
      - name: Download counter tests
        # scripts/ci/download_stats.py, run by download-stats.yml, and that
        # workflow pushing to the stats branch only.
        run: python3 scripts/ci/test_download_stats.py
      - name: Coverage area floor tests
        # scripts/ci/coverage_areas.py, the rust-coverage job's area gate.
        run: python3 scripts/ci/test_coverage_areas.py
      - name: Broker certification kit tests
        # scripts/certify/broker_certify.py (BR-06) against a fake app on
        # ephemeral loopback ports; it never reaches a broker.
        run: python3 -I scripts/certify/test_broker_certify.py
      - name: E2E test build checks
        # scripts/ci/check_no_e2e_build.py (the check before bundling, its
        # backstop, the install smoke's check), tauri-build and release.yml
        # running it inside tauri-action's build before anything is bundled,
        # and the rest of the release workflow's wiring.
        run: |
          python3 scripts/ci/test_check_no_e2e_build.py
          python3 scripts/ci/test_release_workflow.py
      - name: Windows DLL check tests
        # scripts/ci/check_windows_dlls.py (the installed, released and E2E
        # Windows binaries need no DLL that Windows does not ship), and the
        # static C runtime kept in every Windows build that sets RUSTFLAGS.
        run: python3 scripts/ci/test_check_windows_dlls.py
      - name: Native E2E order book check tests
        # scripts/ci/native_e2e_sandbox.py, the sandbox order's check in
        # native-e2e-test-build.yml.
        run: python3 scripts/ci/test_native_e2e_sandbox.py
      - name: Biome (lint, format, import order)
        run: npx biome ci --reporter=github ./src
      - name: Type check
        run: npx tsc -b
      - name: Chart engine references match the pinned openalgo-charts
        # The web's chart-indicator-skill job: a version bump that leaves the
        # chart-indicator skill's export index or the generated drawing-tool
        # and glyph modules behind fails here (CLAUDE.md, "Bumping
        # openalgo-charts is one change").
        run: |
          node .claude/skills/chart-indicator/generate-api-index.mjs --check
          node .claude/skills/chart-indicator/coverage.mjs
          node scripts/generate-drawing-tools.mjs --check
          node scripts/generate-chrome-icons.mjs --check
      - name: Vite build
        run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  frontend-test:
    name: frontend-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The majors declared in package.json engines.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vitest with coverage
        # Fails below the coverage thresholds in vitest.config.ts, measured
        # over every file in src/ (not only the ones tests import).
        run: npx vitest run --coverage
      - name: Coverage summary
        if: always() && matrix.node-version == '22'
        run: |
          f=coverage/coverage-summary.json
          if [ ! -f "$f" ]; then
            echo "No coverage summary was written."
            exit 0
          fi
          {
            echo "### Frontend coverage (src/, every file)"
            echo
            echo "| Metric | Percent |"
            echo "| --- | --- |"
            for m in lines statements functions branches; do
              printf '| %s | %s |\n' "$m" "$(jq -r ".total.${m}.pct" "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always() && matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e (Playwright chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Bound apt network waits
        # A stalled Ubuntu mirror otherwise holds apt-get (run by
        # --with-deps) until the job timeout; fail the request and retry.
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build the app for vite preview
        run: npx vite build
      - name: Playwright tests
        # playwright.config.ts starts `vite preview` through its webServer
        # block; CI=true is set by Actions.
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Flow's journeys against the app's real server (the e2e_server example,
  # scripted broker, analyzer mode): e2e-flow.yml.
  e2e-flow:
    name: e2e-flow
    uses: ./.github/workflows/e2e-flow.yml

  # ------------------------------------------------------------ Secrets
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-gitleaks
      - name: Scan the full history of the commit under test
        # Every commit reachable from the checked-out HEAD, back to the first
        # (fetch-depth 0), and nothing else: gitleaks' default is every ref
        # the checkout fetched, so another branch's commit failed every pull
        # request on 2026-10-20. security.yml still scans every branch.
        run: gitleaks git --config .github/gitleaks.toml --redact --verbose --exit-code 1 --log-opts=HEAD .

  # --------------------------------------------------------- Code health
  code-health:
    name: code-health (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Checker tests
        run: python3 scripts/ci/test_code_health.py
      - name: Nothing new over the limits (CLAUDE.md, Code health)
        # On a pull request the baseline may not gain or raise an entry
        # against the target branch's, unless the maintainer added the
        # code-health-exception label.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'code-health-exception') }}
        run: |
          args=()
          if [ "$EVENT" = "pull_request" ] && [ "$EXCEPTION" != "true" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            args=(--base-ref FETCH_HEAD)
          fi
          python3 scripts/ci/code_health.py "${args[@]}"

  # ------------------------------------------------------- Tauri bundles
  tauri-build:
    name: tauri-build (${{ matrix.name }})
    needs: [rust-lint, rust-test, frontend, frontend-test]
    runs-on: ${{ matrix.os }}
    # Release profile is lto + codegen-units=1 + bundled DuckDB: slow when cold.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # Oldest supported Ubuntu: glibc 2.35 and WebKitGTK 4.1, so the
            # .deb and AppImage run on Debian 12 and newer.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            # ARM64 Linux laptops, desktops and VMs: glibc 2.35 and WebKitGTK
            # 4.1, as for x64. Native arm64 runner, no QEMU. Raspberry Pi is
            # not supported (Pi users run OpenAlgo web).
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            # Cross-compiled on the Apple Silicon runner (macos-13 Intel
            # runners are retired).
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-build-${{ matrix.name }}
          cache-on-failure: true
          # Release caches are large; only main refreshes them, PRs restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Tauri environment report
        # Informational: prints Rust/JS Tauri versions so a mismatch between
        # the tauri crate and @tauri-apps/api is visible in the log.
        continue-on-error: true
        run: npx tauri info
      - uses: actions/setup-python@v7
        # The check before bundling (below) runs as `python` on every system.
        with:
          python-version: "3.12"
      # The steps named in scripts/ci/release_bundles.py (TAURI_BUILD_STEPS)
      # must succeed for a release to ship this run's bundles: a release
      # signs these very files for in-app updates and attaches them, it does
      # not build again. Renaming one means renaming it there.
      - name: Build bundles (no publishing)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          tauriScript: npx tauri
          # updater-artifacts.conf.json: the in-app update bundles too (the
          # macOS .app.tar.gz; the NSIS installer and the AppImage are their
          # own), unsigned: --no-sign leaves out the update signature, which
          # needs the private key no CI run holds, and code signing, which
          # CI has no certificate for either. release.yml signs them.
          # release-checks.conf.json: between compiling and bundling, in
          # this same build, the binary is checked not to be the E2E test
          # build (scripts/ci/check_no_e2e_build.py --tauri-hook); a
          # refused binary stops the build before anything is bundled.
          args: --target ${{ matrix.target }} --ci --no-sign --config src-tauri/updater-artifacts.conf.json --config src-tauri/release-checks.conf.json
      - name: The bundled binary is the one checked before bundling
        # A backstop: the binary must still have the code digest the check
        # recorded (Windows' in-place signature aside), and a missing record
        # means the check did not run. Either fails the job.
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python scripts/ci/check_no_e2e_build.py --same-as-checked "src-tauri/target/${TARGET}/release/openalgo-desktop${EXE}"
      - name: The update bundle is built, unsigned
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="src-tauri/target/${TARGET}/release/bundle"
          case "$RUNNER_OS" in
            macOS) updates=("$bundle"/macos/*.app.tar.gz) ;;
            Windows) updates=("$bundle"/nsis/*-setup.exe) ;;
            *) updates=("$bundle"/appimage/*.AppImage) ;;
          esac
          if [ "${#updates[@]}" -ne 1 ]; then
            echo "::error::Expected one update bundle in ${bundle}, found ${#updates[@]}."
            exit 1
          fi
          sigs=("$bundle"/*/*.sig)
          if [ "${#sigs[@]}" -ne 0 ]; then
            echo "::error::CI signed ${sigs[*]}: a CI build must never hold the update key."
            exit 1
          fi
          echo "Update bundle, unsigned (release.yml signs it): ${updates[0]}"
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------ Installed app
  # The bundles above, installed and started on fresh runners
  # (install-smoke.yml) and driven through the app's own window
  # (native-e2e.yml). Each job takes about a minute once its bundle exists;
  # release.yml requires them green on the tagged commit's master run.
  install-smoke:
    name: install-smoke
    needs: tauri-build
    uses: ./.github/workflows/install-smoke.yml

  native-e2e:
    name: native-e2e
    needs: tauri-build
    uses: ./.github/workflows/native-e2e.yml

  # -------------------------------------------------- Branch protection
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - rust-lint
      - rust-test
      - rust-coverage
      - frontend
      - frontend-test
      - e2e
      - e2e-flow
      - secret-scan
      - code-health
      - tauri-build
      - install-smoke
      - native-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
