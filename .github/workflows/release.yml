name: Release

# Releases OpenAlgo Desktop for every supported platform when a v* tag is
# pushed: a DRAFT GitHub release with the installers, the in-app update
# bundles with their signatures, latest.json (the update manifest) and a
# SHA256SUMS.txt covering them all. A maintainer reviews the draft and
# publishes it by hand. Publishing is what makes the update visible to
# installed copies: they ask releases/latest/download/latest.json, which
# GitHub serves from the newest published, non-prerelease release only
# (docs/release/updates.md).
#
# The installers are the files CI built for the tagged commit (the
# `ci-bundles` job): this workflow downloads the bundles of the CI run the
# gate approved, checks each is the file GitHub recorded for that run, signs
# the update bundles with the update key and attaches them. Nothing is
# compiled, so a release takes minutes, and what a trader downloads is byte
# for byte the file CI built. Not every file was started in CI; what that
# run's install smoke and native E2E did with each, on fresh runners:
#   Windows setup .exe      installed, started, account created and signed
#                           in (Windows Server 2022 and 2025)
#   Linux .deb              the same (x64 and arm64); the x64 one also driven
#                           through its window (native E2E)
#   Linux AppImage          started only, no sign-in (x64 and arm64)
#   macOS Apple Silicon     the app in the .dmg started, signed in
#   macOS Intel             the app in the .dmg never started (no Intel
#                           runner); only its minimum macOS version read
#   macOS .app.tar.gz       never unpacked or started, on either chip,
#                           though every macOS in-app update installs it
# (docs/release/release-workflow.md).
#
# The full rebuild (the `build` job) is the fallback, started by hand:
# Actions > Release > Run workflow, with the tag and build: rebuild. Use it
# when CI's bundles have expired (CI keeps them 7 days) or once Apple or
# Windows code signing is configured, since that signature goes inside the
# app at build time and the rebuilt installers are then not the files the
# install smoke tested.
#
# Release gate (the `verify` job, which every other job waits for): the tag
# must point at a commit on master, its dependencies must pass a fresh
# advisory scan (cargo-deny, cargo-audit and npm audit against today's
# databases, as security.yml gates), the CI workflow's `ci-ok` check must have
# succeeded on that exact commit, the newest CI run of a push of that commit
# to master that was not cancelled must have passed its installed-app jobs
# (install, start and first sign-in on Linux, Windows Server 2022 and 2025
# and macOS; the native end-to-end run) on that commit's own bundles, the
# newest native order journey run of that commit on master
# (native-e2e-test-build.yml: a sandbox order through the app's window on
# Linux and Windows, not part of ci-ok) must have passed, and
# the tag must equal v<version> with the
# same version in src-tauri/Cargo.toml, src-tauri/tauri.conf.json,
# package.json, both lockfiles and the newest CHANGELOG.md section
# (.claude/skills/version-bump/check_versions.py). Unless rebuilding, that
# CI run's own ci-ok, builds (with the check before bundling and its
# backstop) and unexpired bundles must be there too
# (scripts/ci/release_bundles.py check). This workflow does not re-run the
# test suite; the gate is what ties a release to a green CI run. To run the
# gate alone, with nothing built or published: Actions > Release > Run
# workflow, with the tag to check and build: none (the default).
# scripts/release/preflight.sh makes most of the same checks before tagging.
#
# Installers per platform (the rebuild's matrix `bundles` below; CI builds
# every bundle type, and scripts/ci/release_bundles.py picks these):
#   Windows x64            NSIS setup .exe (per-user install)
#   macOS Apple Silicon    .dmg
#   macOS Intel            .dmg
#   Linux x64              AppImage and .deb
#   Linux arm64            AppImage and .deb (ARM64 laptops, desktops and VMs;
#                          not Raspberry Pi, whose users run OpenAlgo web)
#
# Signing is optional. Without the secrets below the bundles are unsigned
# (macOS Gatekeeper and Windows SmartScreen will warn). Configure them under
# Settings > Secrets and variables > Actions:
#
# macOS code signing (all three together):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
# macOS notarization, needs signing above plus ONE of:
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   or
#   APPLE_API_ISSUER, APPLE_API_KEY (key id), APPLE_API_PRIVATE_KEY (contents
#   of the AuthKey_<id>.p8 file)
# Windows code signing (Authenticode, both together):
#   WINDOWS_CERTIFICATE          base64 of the code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD password of that .pfx
# In-app update signing (REQUIRED: the release gate fails without it):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   The private half of the key in src-tauri/tauri.conf.json
#   (plugins.updater.pubkey). CI's builds add
#   src-tauri/updater-artifacts.conf.json (createUpdaterArtifacts) with
#   --no-sign, so each platform also produces its update bundle
#   (.app.tar.gz, the NSIS -setup.exe, the AppImage), unsigned; the
#   ci-bundles job signs each (`tauri signer sign --app-version`), the
#   rebuild signs in its own build. The checksums job builds latest.json
#   from those and refuses a signature that does not verify against the
#   key built into the app.
#
# Empty secrets are never exported: Tauri treats a present-but-empty
# APPLE_CERTIFICATE or APPLE_ID as "configured" and would fail the build.
#
# After each build the installer's signature is checked on the runner that
# built it (codesign and the stapled notarization ticket on macOS,
# Authenticode on Windows). A platform whose signing secrets are configured
# but whose installer is not signed fails its build. The release notes then
# state, per platform, what that check found; they never say "signed" for an
# installer that was not. CI's installers carry no code signature (CI has no
# certificate), so with Apple or Windows signing configured the gate refuses
# the ci-bundles path, and the notes of a ci-bundles release say so.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v1.2.3)"
        required: true
        type: string
      build:
        description: >-
          none: run the release gate only; nothing is built or published.
          ci-bundles: release the bundles CI tested, as a tag push does.
          rebuild: build every platform again (CI's bundles expired, or
          code signing is configured).
        required: true
        default: none
        type: choice
        options: [none, ci-bundles, rebuild]

permissions:
  contents: read

concurrency:
  # Per tag, so a tag push and a run by hand for the same tag never fill
  # one draft at once.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  NODE_VERSION: "22"

jobs:
  verify:
    name: verify (tag on master, ci-ok, install smoke and native order journey green, CI's bundles, version, fresh advisory scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.commit.outputs.sha }}
      ci_run_id: ${{ steps.bundles.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.bundles.outputs.ci_run_attempt }}
    env:
      # The pushed tag, or the tag named when the gate is run by hand.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: The tag name is a release tag, and what this run does
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error title=Release gate::'${TAG}' is not a release tag (v<major>.<minor>.<patch>)."
            exit 1
          fi
          # A tag push releases the bundles CI tested; a run by hand does
          # what its `build` input says.
          if [ "$EVENT" = "push" ]; then
            mode=ci-bundles
          else
            mode="${BUILD:-none}"
          fi
          case "$mode" in
            none | ci-bundles | rebuild) ;;
            *) echo "::error title=Release gate::Unknown build '${mode}'."; exit 1 ;;
          esac
          # A run by hand that publishes runs master's copy of this workflow,
          # not a branch's.
          if [ "$mode" != "none" ] && [ "$EVENT" != "push" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error title=Release gate::Run the release from master (Use workflow from: master), not ${GITHUB_REF}."
            exit 1
          fi
          echo "${TAG}: ${mode}"
          { echo "tag=${TAG}"; echo "mode=${mode}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # Full history, so reachability from master can be checked.
          fetch-depth: 0
      - name: The tag points at a commit on master
        id: commit
        run: |
          set -euo pipefail
          sha=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$(git rev-parse HEAD)" != "$sha" ]; then
            echo "::error title=Release gate::The checked-out commit is not the one ${TAG} points at."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error title=Release gate::${TAG} points at ${sha}, which is not on master. Tag only a commit on master whose CI is green."
            exit 1
          fi
          echo "${TAG} -> ${sha} (on master)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: ci-ok succeeded on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # Only a check run created by GitHub Actions counts: another app
          # could post a check that is merely named ci-ok. The newest run
          # decides, so a failed re-run is not hidden by an older success.
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=ci-ok&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$latest" ]; then
            echo "::error title=Release gate::No ci-ok check has run on ${SHA}. Push the commit to master, wait for CI to finish green, then tag it."
            exit 1
          fi
          read -r status conclusion url <<< "$latest"
          echo "ci-ok on ${SHA}: ${status} ${conclusion} ${url}"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error title=Release gate::ci-ok on ${SHA} is ${status}/${conclusion}, not completed/success: ${url}"
            exit 1
          fi
      - name: Install smoke and the native order journey passed for this commit
        # The installed-app jobs are part of CI (install-smoke.yml and
        # native-e2e.yml, called by ci.yml). Only this repository's CI runs
        # of a push of this exact commit to master count, not a pull
        # request's; the newest that was not cancelled decides and needs
        # every one of those jobs to have succeeded. A master run cancelled
        # because its pull request was already tested has no verdict:
        # re-run it before tagging. The same holds for the native order
        # journey (native-e2e-test-build.yml, outside ci-ok), whose run by
        # hand on master also counts (scripts/ci/smoke_gate.py, tested by
        # test_smoke_gate.py in CI).
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: python3 scripts/ci/smoke_gate.py release "$SHA"
      - name: CI's tested bundles of this commit are there to sign
        id: bundles
        # The installers a release ships are the bundles of the CI run the
        # step above approved. In that run, ci-ok and every tauri-build job
        # must have succeeded, with the check before bundling, its backstop
        # and the unsigned update bundle, and each bundles-<platform>
        # artifact must be that run's, made while that platform's
        # tauri-build job of the gated attempt ran, unexpired, with a
        # sha256 digest (scripts/ci/release_bundles.py check, tested by
        # test_release_bundles.py in CI). Its id and attempt pass to the
        # ci-bundles job. The rebuild does not need them.
        if: steps.mode.outputs.mode != 'rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: python3 scripts/ci/release_bundles.py check "$SHA"
      - name: The tag equals the app version everywhere
        run: python3 .claude/skills/version-bump/check_versions.py --tag "$TAG"
      # NEW-VER-03: the tagged commit's dependencies are scanned now, at
      # release time, with the same gating as security.yml: a green CI run
      # or last week's scan can predate an advisory published since.
      # Accepted advisories are the documented ignores in .github/deny.toml;
      # anything else fails the release before anything is built.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,cargo-audit
      # The commands are scripts/ci/advisory_scan.sh, which security.yml
      # runs every day on master and scripts/release/preflight.sh runs
      # before tagging, so this step is not the first to see an advisory.
      - name: No unaccepted advisory, license or source (cargo-deny, today's database)
        run: scripts/ci/advisory_scan.sh cargo-deny
      - name: No unaccepted vulnerability (cargo-audit, today's database)
        run: scripts/ci/advisory_scan.sh cargo-audit
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
      - name: No high or critical advisory in the shipped JavaScript (npm audit)
        run: scripts/ci/advisory_scan.sh npm-audit
      - name: The update signing key is configured
        # Every release carries signed update bundles; without the key the
        # build fails late, on every platform. Only whether it is set is
        # read here, never its value.
        env:
          HAS_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_UPDATE_KEY" != "true" ]; then
            echo "::error title=Release gate::The TAURI_SIGNING_PRIVATE_KEY secret is not set. In-app updates are signed with it; see docs/release/updates.md."
            exit 1
          fi
      - name: No code signing is configured that CI's installers lack
        # CI has no Apple or Windows certificate, so its installers carry no
        # code signature, and adding one afterwards would change the files
        # the install smoke tested. With either configured, the release
        # builds again (build: rebuild). Only whether the secrets are set is
        # read here.
        if: steps.mode.outputs.mode != 'rebuild'
        env:
          HAS_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          if [ "$HAS_CODE_SIGNING" = "true" ]; then
            echo "::error title=Release gate::Apple or Windows code signing is configured, and CI's installers are not code-signed. Release with Actions > Release > Run workflow, build: rebuild."
            exit 1
          fi

  create-release:
    name: create draft release
    needs: verify
    # A gate-only run stops after verify.
    if: needs.verify.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release for this tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          # Drafts are not reachable through /releases/tags/<tag>, so list.
          # "<id> draft" or "<id> published" of this tag's release, a
          # published one first, so it is refused even beside a draft.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | python3 -c '
          import json, os, sys
          same = [r for r in json.load(sys.stdin) if r.get("tag_name") == os.environ["TAG"]]
          same.sort(key=lambda r: r.get("draft") is True)
          if same:
              print(same[0]["id"], "draft" if same[0].get("draft") is True else "published")
          ')
          if [ -n "$existing" ]; then
            read -r id state <<< "$existing"
            # A run by hand of a tag already released (ci-bundles or
            # rebuild) would replace the files traders downloaded, and
            # checksums would remove latest.json while it re-attaches it.
            if [ "$state" != "draft" ]; then
              echo "::error title=Release::Release ${id} of ${TAG} is published, and this workflow changes only a draft: installed copies update from a published release. Release a new version instead."
              exit 1
            fi
            echo "Reusing draft release ${id} for ${TAG}"
          else
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="OpenAlgo Desktop ${TAG}" \
              -f body="$(printf '%s\n\n%s\n%s\n%s\n' \
                'Installers for Windows, macOS (Apple Silicon and Intel), Linux x64 and Linux arm64. SHA256SUMS.txt lists the checksum of every file. Installed copies of OpenAlgo Desktop offer this version as an in-app update once the release is published (latest.json).' \
                '<!-- signing:start -->' \
                'Code signing: not checked yet. This note is replaced once every installer is attached and its signature known.' \
                '<!-- signing:end -->')" \
              -F draft=true \
              -F prerelease="$prerelease" \
              -F generate_release_notes=true \
              --jq .id)
            echo "Created draft release ${id} for ${TAG}"
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  ci-bundles:
    # The default path: the installers are CI's, unchanged (what its install
    # smoke did with each: the table at the top); only the update
    # signatures are new.
    name: sign and attach the bundles CI tested
    needs: [verify, create-release]
    if: needs.verify.outputs.mode == 'ci-bundles'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      SHA: ${{ needs.verify.outputs.sha }}
      RUN_ID: ${{ needs.verify.outputs.ci_run_id }}
      RUN_ATTEMPT: ${{ needs.verify.outputs.ci_run_attempt }}
    steps:
      # The tagged commit: the manifest's public key, the product name and
      # the scripts are the ones the bundles were built with.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Download the bundles of the CI run the gate approved
        # The run is read again by its id and must still be the gated
        # attempt, green, with its checks; each artifact must hash to the
        # sha256 GitHub recorded when CI uploaded it
        # (scripts/ci/release_bundles.py download).
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_bundles.py download "$SHA" --run "$RUN_ID" --attempt "$RUN_ATTEMPT" --out "${RUNNER_TEMP}/ci-bundles"
      - name: Choose the release files, under the names GitHub publishes
        # The installers and update bundles of each platform, copied
        # unchanged; only the macOS update bundle is renamed, as
        # tauri-action always named it (<product>_<version>_<arch>.app.tar.gz).
        run: |
          set -euo pipefail
          python3 scripts/ci/release_bundles.py stage "${RUNNER_TEMP}/ci-bundles" \
            --version "${TAG#v}" --config src-tauri/tauri.conf.json \
            --out "${RUNNER_TEMP}/release" --sign-list "${RUNNER_TEMP}/to-sign.txt" \
            | tee "${RUNNER_TEMP}/staged.tsv"
          {
            echo "### Installers of ${TAG}: CI run ${RUN_ID} (attempt ${RUN_ATTEMPT}) of ${SHA}"
            echo
            echo "| Platform | File | SHA-256 |"
            echo "| --- | --- | --- |"
            while IFS=$'\t' read -r platform file digest; do
              echo "| ${platform} | ${file} | ${digest#sha256:} |"
            done < "${RUNNER_TEMP}/staged.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the Tauri CLI the lockfile pins
        # No install script runs; the update key reaches only the next step.
        run: npm ci --ignore-scripts
      - name: Sign the update bundles with the update key
        # --app-version binds the version into each signature, which the app
        # requires (requireSignedVersion). The checksums job verifies every
        # signature against the key built into the app before latest.json
        # is attached.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty password secret is not passed on (a key without one).
          if [ -n "$UPDATE_KEY_PASSWORD" ]; then
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATE_KEY_PASSWORD"
          fi
          while IFS= read -r bundle; do
            ./node_modules/.bin/tauri signer sign --app-version "${TAG#v}" "$bundle" < /dev/null
            if [ ! -s "${bundle}.sig" ]; then
              echo "::error::No signature was written for $(basename "$bundle")."
              exit 1
            fi
            echo "Signed $(basename "$bundle")"
          done < "${RUNNER_TEMP}/to-sign.txt"
      - name: Record that CI's installers carry no code signature
        # For the release notes (checksums job). CI has no code-signing
        # certificate, and the gate refused this path if one is configured.
        run: |
          set -euo pipefail
          mkdir -p signing
          for name in windows-x86_64 macos-aarch64 macos-x86_64; do
            echo "not code-signed (built by CI, which has no code-signing certificate)" > "signing/${name}.txt"
          done
          for name in linux-x86_64 linux-aarch64; do
            echo "not code-signed; check the download against SHA256SUMS.txt" > "signing/${name}.txt"
          done
      - name: Upload the signature check
        uses: actions/upload-artifact@v7
        with:
          name: signing-ci-bundles
          path: signing/
          if-no-files-found: error
          retention-days: 30
      - name: The release is still a draft
        # A re-run of failed jobs reuses create-release's earlier answer
        # without running it again; a release published since then is left
        # alone, since installed copies update from it.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)
          if [ "$draft" != "true" ]; then
            echo "::error title=Release::Release ${RELEASE_ID} is no longer a draft, and this workflow changes only a draft: installed copies update from a published release. Release a new version instead."
            exit 1
          fi
      - name: Attach to the draft release
        # A file an earlier attempt attached under the same name is replaced.
        # Each attached file must then have the size and, where GitHub
        # reports one, the sha256 of the file it came from.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          assets="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"
          upload_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .upload_url)
          upload_url="${upload_url%%\{*}"
          attach() {
            local file="$1" name id
            name=$(basename "$file")
            # Names are [A-Za-z0-9._-] only (release_bundles.py stage).
            for id in $(gh api --paginate "$assets" --jq ".[] | select(.name == \"${name}\") | .id"); do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
            done
            gh api -X POST "${upload_url}?name=${name}" -H "Content-Type: application/octet-stream" \
              --input "$file" --jq .name
          }
          for file in "${RUNNER_TEMP}"/release/*; do
            attach "$file" || { sleep 15; attach "$file"; } || { sleep 60; attach "$file"; }
          done
          gh api --paginate "$assets" --jq '.[] | "\(.name)\t\(.size)\t\(.digest // "")"' > "${RUNNER_TEMP}/attached.tsv"
          for file in "${RUNNER_TEMP}"/release/*; do
            name=$(basename "$file")
            line=$(awk -F '\t' -v n="$name" '$1 == n' "${RUNNER_TEMP}/attached.tsv")
            IFS=$'\t' read -r _ size digest <<< "$line"
            if [ "${size:-}" != "$(stat -c %s "$file")" ]; then
              echo "::error::${name} is attached with ${size:-no} bytes, not $(stat -c %s "$file")."
              exit 1
            fi
            if [ -n "${digest:-}" ] && [ "$digest" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]; then
              echo "::error::${name} is attached as ${digest}, not the file CI built."
              exit 1
            fi
            echo "${name}: ${size} bytes ${digest:-(no digest reported)}"
          done

  build:
    # The fallback, by hand (build: rebuild): every platform built again,
    # signed in its own build.
    name: build (${{ matrix.name }})
    needs: [verify, create-release]
    if: needs.verify.outputs.mode == 'rebuild'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: linux-aarch64
            # ARM64 Linux laptops, desktops and VMs (not Raspberry Pi).
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            # `app` too: Tauri's bundler (2.12) archives the .app into the
            # update bundle (.app.tar.gz) only when `app` is asked for;
            # with `dmg` alone it deletes the .app and makes none.
            bundles: app,dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # Same key as ci.yml tauri-build, so a tag restores main's cache.
          shared-key: tauri-build-${{ matrix.name }}
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Export configured signing secrets
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              {
                printf '%s<<__OPENALGO_SECRET_EOF__\n' "$name"
                printf '%s\n' "$value"
                printf '__OPENALGO_SECRET_EOF__\n'
              } >> "$GITHUB_ENV"
              echo "${name}: configured"
            else
              echo "${name}: not set"
            fi
          }
          if [ "$RUNNER_OS_NAME" = "macOS" ]; then
            if [ -n "${APPLE_CERTIFICATE:-}" ]; then
              for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
                export_if_set "$v"
              done
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
                export_if_set "$v"
              done
              if [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
                key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY:-notary}.p8"
                printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
                chmod 600 "$key_path"
                echo "APPLE_API_KEY_PATH=${key_path}" >> "$GITHUB_ENV"
                echo "APPLE_API_KEY_PATH: configured"
              fi
            else
              echo "macOS signing not configured; building an unsigned app."
            fi
          fi
          export_if_set TAURI_SIGNING_PRIVATE_KEY
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "Windows signing not configured; building unsigned installers."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # Merge the thumbprint into tauri.conf.json at build time instead of
          # committing it: tauri build --config <file>.
          $config = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm       = 'sha256'
                timestampUrl          = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $config -Encoding utf8
          $configArg = $config -replace '\\', '/'
          "TAURI_EXTRA_ARGS=--config $configArg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows signing configured."

      - uses: actions/setup-python@v7
        # The check before bundling (below) runs as `python` on every system.
        with:
          python-version: "3.12"

      - name: The release is still a draft
        # A re-run of failed jobs reuses create-release's earlier answer
        # without running it again; a release published since then is left
        # alone, since installed copies update from it.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)
          if [ "$draft" != "true" ]; then
            echo "::error title=Release::Release ${RELEASE_ID} is no longer a draft, and this workflow changes only a draft: installed copies update from a published release. Release a new version instead."
            exit 1
          fi
      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          # updater-artifacts.conf.json: the signed update bundles, made
          # only here (CI and local builds have no signing key).
          # release-checks.conf.json: between compiling and bundling, in
          # this same build, the binary is checked not to be CI's E2E test
          # build (src-tauri/src/e2e.rs, scripts/ci/check_no_e2e_build.py
          # --tauri-hook). A refused binary stops the build: nothing is
          # bundled or uploaded.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci --config src-tauri/updater-artifacts.conf.json --config src-tauri/release-checks.conf.json ${{ env.TAURI_EXTRA_ARGS }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.verify.outputs.tag }}
          # The update bundles and their .sig files go up; latest.json is
          # built once, from every platform, by the checksums job (parallel
          # jobs each rewriting it would race).
          uploadUpdaterSignatures: true
          uploadUpdaterJson: false

      - name: The bundled binary is the one checked before bundling
        # A backstop, after the upload: the binary must still have the code
        # digest the check recorded (Windows' in-place signature aside), and
        # a missing record means the check did not run. Either fails the job.
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python scripts/ci/check_no_e2e_build.py --same-as-checked "src-tauri/target/${TARGET}/release/openalgo-desktop${EXE}"

      - name: The Windows app needs only DLLs that Windows ships
        # A DLL missing on the trader's PC stops the app before its window
        # opens (scripts/ci/check_windows_dlls.py).
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/ci/check_windows_dlls.py "src-tauri/target/${TARGET}/release/openalgo-desktop.exe"

      - name: The update bundle is signed
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="src-tauri/target/${TARGET}/release/bundle"
          case "$RUNNER_OS" in
            macOS) sigs=("$bundle"/macos/*.app.tar.gz.sig) ;;
            Windows) sigs=("$bundle"/nsis/*-setup.exe.sig) ;;
            *) sigs=("$bundle"/appimage/*.AppImage.sig) ;;
          esac
          if [ "${#sigs[@]}" -ne 1 ]; then
            echo "::error::Expected one signed update bundle in ${bundle}, found ${#sigs[@]}."
            exit 1
          fi
          echo "Update bundle signature: ${sigs[0]}"

      - name: Remove notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "${RUNNER_TEMP}"/AuthKey_*.p8

      - name: Check the installer signature
        # What the release notes say about signing comes from this check, not
        # from whether secrets exist. Configured signing that produced an
        # unsigned installer fails the build.
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="src-tauri/target/${TARGET}/release/bundle"
          case "$RUNNER_OS" in
            macOS)
              apps=("$bundle"/macos/*.app)
              if [ "${#apps[@]}" -ne 1 ]; then
                echo "::error::Expected one .app in ${bundle}/macos, found ${#apps[@]}."
                exit 1
              fi
              app="${apps[0]}"
              # An ad-hoc (linker) signature also verifies, so the authority
              # must be a Developer ID.
              if codesign --verify --deep --strict "$app" 2>/dev/null \
                && codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
                if xcrun stapler validate "$app" >/dev/null 2>&1; then
                  result="signed and notarized"
                else
                  result="signed, not notarized"
                fi
              else
                result="not code-signed"
              fi
              if [ -n "${APPLE_CERTIFICATE:-}" ] && [ "$result" = "not code-signed" ]; then
                echo "::error::macOS signing is configured but ${app} carries no Developer ID signature."
                exit 1
              fi
              if { [ -n "${APPLE_ID:-}" ] || [ -n "${APPLE_API_ISSUER:-}" ]; } && [ "$result" != "signed and notarized" ]; then
                echo "::error::Notarization is configured but ${app} has no stapled notarization ticket."
                exit 1
              fi
              ;;
            Windows)
              exes=("$bundle"/nsis/*.exe)
              if [ "${#exes[@]}" -ne 1 ]; then
                echo "::error::Expected one installer in ${bundle}/nsis, found ${#exes[@]}."
                exit 1
              fi
              # $env:EXE is PowerShell's, expanded by pwsh, not by bash.
              # shellcheck disable=SC2016
              status=$(EXE="${exes[0]}" pwsh -NoProfile -Command '(Get-AuthenticodeSignature -LiteralPath $env:EXE).Status.ToString()' | tr -d '\r')
              echo "Authenticode status of ${exes[0]}: ${status}"
              if [ "$status" = "Valid" ]; then
                result="signed"
              else
                result="not code-signed"
              fi
              if [ -n "${TAURI_EXTRA_ARGS:-}" ] && [ "$result" != "signed" ]; then
                echo "::error::Windows signing is configured but the installer's signature is ${status}."
                exit 1
              fi
              ;;
            *)
              result="not code-signed; check the download against SHA256SUMS.txt"
              ;;
          esac
          echo "${NAME}: ${result}"
          mkdir -p signing
          printf '%s\n' "$result" > "signing/${NAME}.txt"

      - name: The .deb depends on what the binary links
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/"${TARGET}"/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#debs[@]}."
            exit 1
          fi
          scripts/ci/check_deb.sh "${debs[0]}"

      - name: Upload the signature check
        uses: actions/upload-artifact@v7
        with:
          name: signing-${{ matrix.name }}
          path: signing/
          if-no-files-found: error
          retention-days: 30

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: update manifest, checksums and signing notes
    needs: [verify, create-release, ci-bundles, build]
    # After whichever of ci-bundles and build ran, once it succeeded.
    if: >-
      !cancelled() && needs.create-release.result == 'success' &&
      (needs.ci-bundles.result == 'success' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The app's public key, CHANGELOG.md and the manifest script, of the
      # tagged commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Install minisign
        run: |
          # A stalled mirror fails the request and retries (as in
          # .github/actions/linux-tauri-deps) instead of holding the job.
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          minisign -v
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/release-assets"
          rm -rf "$work"
          mkdir -p "$work"
          # The files exactly as published (GitHub renames spaces in asset
          # names), so checksums and update addresses match what a trader
          # downloads. Files this job writes are made again.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name != "SHA256SUMS.txt" and .name != "latest.json") | "\(.id)\t\(.name)"' \
            > "${RUNNER_TEMP}/assets.tsv"
          count=0
          while IFS=$'\t' read -r id name; do
            case "$name" in
              */*|..*|"") echo "Unexpected asset name: ${name}"; exit 1 ;;
            esac
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "${work}/${name}"
            count=$((count + 1))
          done < "${RUNNER_TEMP}/assets.tsv"
          if [ "$count" -lt 7 ]; then
            echo "Expected at least 7 installers on the release, found ${count}."
            exit 1
          fi

      - name: The release is still a draft
        # A re-run of failed jobs reuses create-release's earlier answer
        # without running it again; a release published since then is left
        # alone, since installed copies update from it.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)
          if [ "$draft" != "true" ]; then
            echo "::error title=Release::Release ${RELEASE_ID} is no longer a draft, and this workflow changes only a draft: installed copies update from a published release. Release a new version instead."
            exit 1
          fi
      - name: Attach latest.json (the in-app update manifest)
        # Every platform's update bundle, its address on this release and
        # its signature; each signature must verify against the key built
        # into the app and name this version (scripts/ci/updater_manifest.py).
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/release-assets"
          python3 scripts/ci/updater_manifest.py \
            --assets "$work" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --changelog CHANGELOG.md --config src-tauri/tauri.conf.json \
            --minisign minisign --out "${RUNNER_TEMP}/latest.json"
          old=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')
          for id in $old; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
          upload_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .upload_url)
          upload_url="${upload_url%%\{*}"
          gh api -X POST "${upload_url}?name=latest.json" \
            -H "Content-Type: application/json" \
            --input "${RUNNER_TEMP}/latest.json" --jq .browser_download_url
          cp "${RUNNER_TEMP}/latest.json" "$work/latest.json"

      - name: Attach SHA256SUMS.txt to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/release-assets"
          (cd "$work" && sha256sum -- * | sort -k2) > "${RUNNER_TEMP}/SHA256SUMS.txt"
          cat "${RUNNER_TEMP}/SHA256SUMS.txt"
          # A re-run replaces the previous checksum file.
          old=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.name == "SHA256SUMS.txt") | .id')
          for id in $old; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
          upload_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .upload_url)
          upload_url="${upload_url%%\{*}"
          gh api -X POST "${upload_url}?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" \
            --input "${RUNNER_TEMP}/SHA256SUMS.txt" --jq .browser_download_url

      - name: Download the signature checks
        uses: actions/download-artifact@v8
        with:
          pattern: signing-*
          path: signing
          merge-multiple: true

      - name: State the code signing of each installer in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          section="Code signing of each installer:"
          warn=false
          for row in \
            "windows-x86_64|Windows x64" \
            "macos-aarch64|macOS Apple Silicon" \
            "macos-x86_64|macOS Intel" \
            "linux-x86_64|Linux x64" \
            "linux-aarch64|Linux arm64"; do
            name="${row%%|*}"
            label="${row#*|}"
            if [ -f "signing/${name}.txt" ]; then
              result=$(head -n1 "signing/${name}.txt")
            else
              result="not checked"
            fi
            # Gatekeeper also blocks a signed app that is not notarized.
            case "$name:$result" in
              "windows-x86_64:signed" | macos-*:"signed and notarized" | linux-*) ;;
              *) warn=true ;;
            esac
            section="${section}"$'\n'"- ${label}: ${result}"
          done
          if [ "$warn" = true ]; then
            section="${section}"$'\n\n'"An installer that is not code-signed (on macOS: not notarized) shows a warning the first time it is opened: see the README for how to open the app the first time."
          fi
          echo "$section"
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.body // ""')
          new_body=$(BODY="$body" SECTION="$section" python3 -c '
          import os
          body, section = os.environ["BODY"], os.environ["SECTION"]
          start, end = "<!-- signing:start -->", "<!-- signing:end -->"
          block = start + "\n" + section + "\n" + end
          i, j = body.find(start), body.find(end)
          if i != -1 and j > i:
              body = body[:i] + block + body[j + len(end):]
          else:
              body = body.rstrip() + "\n\n" + block + "\n"
          print(body)
          ')
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f body="$new_body" --jq .html_url
