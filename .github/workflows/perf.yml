name: Perf

# Performance and durability benchmarks against the acceptance targets
# (tests/it/perf, docs/audit/perf.md): tick to risk decision, order-socket
# reconnect to book reconciled, order-path SQLite wait during a Historify
# import, critical event delivery under a 10x burst, disk growth, and the
# endurance run with injected faults. They are #[ignore]d in the normal
# suite and never run on pull requests; this workflow runs them nightly and
# on demand on Linux and publishes the numbers as the `perf-results`
# artifact (one JSON object per measurement, plus the log).

on:
  schedule:
    # Nightly, 21:30 UTC (03:00 IST), outside Indian market hours.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      endurance_minutes:
        description: "Endurance run length in minutes (the job's limit is 6 h)"
        required: false
        default: "15"
      filter:
        description: "Which benchmarks (a test filter under perf::)"
        required: false
        default: "perf::"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    # GitHub runs this as `bash -eo pipefail`, so `| tee` keeps the status.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  perf:
    name: perf (ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Frontend dist placeholder
        run: mkdir -p dist && test -f dist/index.html || echo '<!doctype html><title>ci</title>' > dist/index.html
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # The CI test job's build; read its cache, never write it.
          shared-key: rust-test-ubuntu-22.04
          save-if: false
      - name: Benchmarks
        working-directory: src-tauri
        env:
          OPENALGO_PERF_OUT: ${{ github.workspace }}/perf-results.jsonl
          OPENALGO_PERF_MINUTES: ${{ inputs.endurance_minutes || '15' }}
          FILTER: ${{ inputs.filter || 'perf::' }}
        run: |
          cargo test --locked --test it "$FILTER" -- --ignored --nocapture --test-threads=1 2>&1 | tee ../perf.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Perf results ($(git rev-parse --short HEAD))"
            echo '```'
            grep '^PERF ' perf.log || echo "no measurements"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            perf-results.jsonl
            perf.log
          if-no-files-found: ignore
          retention-days: 90
