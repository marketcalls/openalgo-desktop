name: Native E2E

# The installed release app driven through its own window by WebDriver
# (tauri-driver), against its real Rust server, sign-in and session cookie:
# first-start account creation, a refused wrong password, sign-in, the
# signed-in shell, and sign-out (scripts/ci/native_e2e.py). This is what the
# Playwright suite cannot show: it runs a browser against `vite preview`
# with stubbed answers (COV-03, COV-04).
#
#   Linux x64   the .deb, WebKitGTK's WebKitWebDriver, under Xvfb
#
# Windows needs a test build. msedgedriver drives WebView2 through its
# remote debugging port, which it asks for through the environment
# (WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS). The release app's webview does
# not take that switch from the environment: on Windows Server 2025 the
# WebView2 processes ran and loaded the app, but no debugging port opened,
# launched by msedgedriver or by hand (2026-10-12, runs 38275143364 and
# 38280440540). That is right for a release build; the test build that
# opens the port itself runs in native-e2e-test-build.yml.
#
# macOS has no WebDriver for WKWebView; the install smoke's HTTP sign-in is
# what covers it there.
#
# A job of every CI run (ci.yml calls this workflow after tauri-build, and
# ci-ok needs it), on the .deb that run built, with this workflow and the
# script from the same commit; the job names that commit in its summary.
#
# A sandbox order through the order form needs a broker to quote from,
# which the release app has none of in CI: native-e2e-test-build.yml places
# one on Linux and Windows against a test build with a scripted broker,
# after pushes to master.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: native e2e (linux x86_64)
    runs-on: ubuntu-22.04
    # The install below needs about 40 MB from the runner's Ubuntu mirror,
    # which some nights serves the 27 MB WebKit package alone in 4 to 7
    # minutes (the 1.0.1 and 1.0.2 nights: the 15-minute limit cut the job off
    # before the journey started). The package files come from the cache
    # (apt-cached) unless Ubuntu updated them since; the limit leaves room
    # for a night it did. The journey itself takes about 5.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/tested_commit.sh
      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles-linux-x86_64
          path: bundles
      - name: What the .deb depends on
        id: deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#debs[@]}."
            exit 1
          fi
          echo "depends=$(bash scripts/ci/deb_depends.sh "${debs[0]}")" >> "$GITHUB_OUTPUT"
      - name: Install Xvfb, WebKitWebDriver and the .deb's dependencies
        uses: ./.github/actions/apt-cached
        with:
          name: native-e2e-runtime
          packages: xvfb webkit2gtk-driver ${{ steps.deb.outputs.depends }}
      - name: Install the .deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          sudo apt-get install -y --no-install-recommends "./${debs[0]}"
          command -v WebKitWebDriver
      - name: Install tauri-driver and selenium
        run: |
          cargo install tauri-driver --locked --version 2.1.0
          python3 -m pip install --user selenium==4.27.1
      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb did not start within 10 s."
            exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Set up, sign in and sign out in the app's window
        run: python3 scripts/ci/native_e2e.py /usr/bin/openalgo-desktop
