name: Native E2E

# The installed release app driven through its own window by WebDriver
# (tauri-driver), against its real Rust server, sign-in and session cookie:
# first-start account creation, a refused wrong password, sign-in, the
# signed-in shell, and sign-out (scripts/ci/native_e2e.py). This is what the
# Playwright suite cannot show: it runs a browser against `vite preview`
# with stubbed answers (COV-03, COV-04).
#
#   Linux x64   the .deb, WebKitGTK's WebKitWebDriver, under Xvfb
#
# Windows needs a test build. msedgedriver drives WebView2 through its
# remote debugging port, which it asks for through the environment
# (WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS). The release app's webview does
# not take that switch from the environment: on Windows Server 2025 the
# WebView2 processes ran and loaded the app, but no debugging port opened,
# launched by msedgedriver or by hand (2026-10-12, runs 38275143364 and
# 38280440540). That is right for a release build; a test-only build that
# opens the port itself comes with the scripted-broker build below.
#
# macOS has no WebDriver for WKWebView; the install smoke's HTTP sign-in is
# what covers it there.
#
# Runs after every successful CI push to master, or by hand with the id of
# such a CI run. Like the install smoke, the `source` job checks that run
# through the API before anything is downloaded. Not yet part of the release
# gate or ci-ok: once it has stayed green, add its jobs to
# scripts/ci/smoke_gate.py or make it a job of CI
# (docs/release/branch-protection.md).
#
# Next step (needs a Rust change): a test-only build with a scripted broker,
# so one order can be placed in sandbox mode through the UI and seen in the
# order book; the release app has no broker to quote from in CI.

run-name: >-
  Native E2E of ${{ github.event_name == 'workflow_dispatch'
  && format('CI run {0}', inputs.run_id)
  || format('{0} (CI run {1})', github.event.workflow_run.head_sha, github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of a successful CI run on master whose bundles to test"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    name: source (the CI run whose bundles are tested)
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The CI run is a successful push to master in this repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: python3 scripts/ci/smoke_gate.py source "$RUN_ID"

  linux:
    name: native e2e (linux x86_64)
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.source.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Download the bundles
        uses: actions/download-artifact@v7
        with:
          name: bundles-linux-x86_64
          path: bundles
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install the .deb, Xvfb and WebKitWebDriver
        run: |
          set -euo pipefail
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
          sudo apt-get update
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#debs[@]}."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends "./${debs[0]}" xvfb webkit2gtk-driver
          command -v WebKitWebDriver
      - name: Install tauri-driver and selenium
        run: |
          cargo install tauri-driver --locked
          python3 -m pip install --user selenium==4.27.1
      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb did not start within 10 s."
            exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Set up, sign in and sign out in the app's window
        run: python3 scripts/ci/native_e2e.py /usr/bin/openalgo-desktop
