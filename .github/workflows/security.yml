name: Security Scan

# Daily, on demand, and on any PR or push that changes a lockfile, a
# manifest or this scanning configuration.
#
# Daily because the release gate (release.yml) scans the tagged commit with
# that day's advisory databases: an advisory published since the last scan
# stopped the 1.0.0 release twice on 2026-10-22, each time after a full CI
# run. cargo-audit, cargo-deny and npm-audit run the gate's own commands
# (scripts/ci/advisory_scan.sh), so a red scan here on master is the release
# gate failing early; scripts/release/preflight.sh runs them before tagging.
# GitHub mails a failed scheduled run to whoever last changed its schedule.
#
# Gating policy (what fails the job):
#   cargo-audit   any vulnerability advisory for src-tauri/Cargo.lock that is
#                 not ignored in .github/deny.toml. Unmaintained / unsound /
#                 yanked notices are reported in the JSON artifact only.
#   cargo-deny    advisories, licenses, bans and sources per .github/deny.toml.
#   npm-audit     production dependencies (--omit=dev) with a HIGH or CRITICAL
#                 advisory. Moderate and low are reported in the JSON artifact
#                 and must be triaged, but do not fail. Dev-only tooling (vite,
#                 vitest, playwright, biome) never ships in the installer, so
#                 the all-dependency report (npm-audit-all.json) never fails
#                 either; it is read at every periodic review (PROD-SEC-02).
#   gitleaks      any secret in the full git history not in the allowlist in
#                 .github/gitleaks.toml.
#   trivy         report only (SARIF to Code Scanning); gating is done by the
#                 language-native auditors above so there is one source of
#                 truth per ecosystem.

on:
  schedule:
    - cron: "0 2 * * *" # every day 02:00 UTC (07:30 IST), the web repo's weekly slot
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/deny.toml
      - .github/gitleaks.toml
      - .github/workflows/security.yml
      - scripts/ci/advisory_scan.sh
  push:
    branches: [master]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/deny.toml
      - .github/gitleaks.toml
      - .github/workflows/security.yml
      - scripts/ci/advisory_scan.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Code Scanning uploads need security-events: write, which a PR from a fork
  # never gets; skip the upload there instead of failing.
  CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  cargo-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - name: JSON report (all findings, never fails)
        run: cargo audit --file src-tauri/Cargo.lock --json > cargo-audit.json || true
      - name: Fail on vulnerabilities (ignores come from .github/deny.toml)
        run: scripts/ci/advisory_scan.sh cargo-audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-audit
          path: cargo-audit.json
          if-no-files-found: ignore
          retention-days: 30

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      - name: SARIF report (never fails)
        # Duplicate-version warnings (bans) are dependency hygiene, not
        # vulnerabilities; they stay in the job log (next step) and are kept
        # out of Code Scanning so its alerts mean something.
        run: |
          cargo deny --manifest-path src-tauri/Cargo.toml --config .github/deny.toml --locked \
            --format sarif check advisories licenses sources > cargo-deny.sarif || true
          if ! jq -e . cargo-deny.sarif > /dev/null 2>&1; then
            echo "::warning::cargo-deny SARIF missing or invalid; uploading an empty report."
            # shellcheck disable=SC2016 # literal "$schema" key, not a variable
            printf '%s\n' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"cargo-deny","rules":[]}},"results":[]}]}' > cargo-deny.sarif
          fi
      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true'
        continue-on-error: true # Code Scanning may be disabled on the repo
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cargo-deny.sarif
          category: cargo-deny
      - name: Check advisories, bans, licenses, sources
        run: scripts/ci/advisory_scan.sh cargo-deny

  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
      - name: JSON report (all severities, never fails)
        run: npm audit --omit=dev --json > npm-audit.json || true
      - name: JSON report of every dependency, dev tooling included (never fails)
        run: npm audit --json > npm-audit-all.json || true
      - name: Fail on high or critical
        run: scripts/ci/advisory_scan.sh npm-audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit
          path: |
            npm-audit.json
            npm-audit-all.json
          if-no-files-found: ignore
          retention-days: 30

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-gitleaks
      - name: Scan full git history
        id: scan
        run: |
          gitleaks git --config .github/gitleaks.toml --redact \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1 .
      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy:
    name: trivy fs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (lockfiles and secrets)
        # Pinned to a commit, not a tag: trivy-action tags were re-pointed
        # in a 2026 supply-chain incident. Dependabot keeps the pin current.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: node_modules,src-tauri/target,dist
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload SARIF
        if: always() && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy
          path: trivy.sarif
          if-no-files-found: ignore
          retention-days: 30
