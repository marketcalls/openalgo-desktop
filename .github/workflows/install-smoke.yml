name: Install smoke

# Installs the bundles a CI run built, starts the installed app with a fresh
# home and data folder, and waits until it serves its HTTP API; then checks
# the packaged binary's `mcp` subcommand over piped stdio, and the .deb's
# dependency list against what the binary links. A green CI run proves the
# code builds and its tests pass; this is the evidence that an installer
# installs and the installed app starts and signs a trader in.
#
#   Linux x64, Linux arm64  apt install ./<deb> on a fresh runner, start under
#                           Xvfb, create the account and sign in; the
#                           AppImage too (extract-and-run, no FUSE), start only
#   Windows Server 2022,    silent per-user NSIS install, start the installed
#   Windows Server 2025     app (a GUI-subsystem executable), create the
#                           account and sign in
#   macOS Apple Silicon     the app copied out of the .dmg, started with its
#                           window, account created and signed in
#
# "Sign in" is the trader's first start through the app's own HTTP on the
# shipped port: POST /setup, POST /auth/login, GET /auth/session-status,
# plus a wrong password that must be refused (scripts/ci/launch_smoke.py).
# No OS keychain is used on any system (KEY-01): session-status must say the
# keys are locked until the sign-in and open after it.
# Every job also runs the packaged `mcp` subcommand over piped stdio: with
# no app (a closed port), and, after the sign-in, against the running app
# with an MCP token created on it (protocol versions, the 49 tools, two
# calls, a token revoked midway; launch_smoke.py --mcp-bridge).
#
# Runs after every successful CI push to master, or by hand with the id of
# such a CI run (Actions > Install smoke > Run workflow). Either way the
# `source` job first checks, through the API, that the run is a successful
# push to this repository's master (scripts/ci/smoke_gate.py source); a pull
# request's or a fork's bundles are never installed. release.yml refuses to
# build a tag unless the newest run of this workflow on master that installed
# that commit's bundles passed on every platform (smoke_gate.py release). It
# is not part of ci-ok: docs/release/branch-protection.md says how to make
# it a job of CI so that it is.
#
# The app binds the shipped ports 5000 and 8765 here, which is fine on a CI
# runner and is why scripts/ci/launch_smoke.py refuses to run outside CI.

# Named after the CI run whose bundles are installed (and its commit when
# known at start): the release gate reads only the run id from the name and
# checks that CI run through the API, so the name is a pointer, not proof.
run-name: >-
  Install smoke of ${{ github.event_name == 'workflow_dispatch'
  && format('CI run {0}', inputs.run_id)
  || format('{0} (CI run {1})', github.event.workflow_run.head_sha, github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of a successful CI run on master whose bundles to install"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    name: source (the CI run whose bundles are installed)
    # For workflow_run, cheap filters first; smoke_gate.py source then checks
    # every case, a hand-run one included, against the API.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The CI run is a successful push to master in this repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: python3 scripts/ci/smoke_gate.py source "$RUN_ID"

  linux:
    name: linux (${{ matrix.name }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-22.04
          - name: aarch64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # After CI: the scripts as they were in the commit under test.
          ref: ${{ github.event_name == 'workflow_run' && needs.source.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Download the bundles
        uses: actions/download-artifact@v7
        with:
          name: bundles-linux-${{ matrix.name }}
          path: bundles
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Bound apt network waits
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
          sudo apt-get update
      - name: Install the .deb (apt resolves its Depends)
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#debs[@]}."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends "./${debs[0]}" xvfb
          dpkg -L open-algo-desktop | grep -E '^/usr/bin/'
      - name: The .deb depends on what the binary links
        run: |
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          scripts/ci/check_deb.sh "${debs[0]}"
      - name: Start a display
        # Wait for the X server's socket: the app is launched in the next
        # step, and on the slower ARM runner it once started before Xvfb was
        # listening ("Failed to initialize GTK").
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb did not start within 10 s."
            exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Launch the installed app, create the account and sign in
        run: python3 scripts/ci/launch_smoke.py --first-sign-in --mcp-bridge /usr/bin/openalgo-desktop
      - name: Launch the AppImage
        env:
          # No FUSE on the runner: the AppImage runtime extracts and runs.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(bundles/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage, found ${#images[@]}."
            exit 1
          fi
          chmod +x "${images[0]}"
          python3 scripts/ci/launch_smoke.py "$(realpath "${images[0]}")"
      - name: MCP over piped stdio (installed binary)
        run: python3 scripts/ci/mcp_stdio_smoke.py /usr/bin/openalgo-desktop

  windows:
    # Windows Server 2022 and 2025 with Desktop Experience are supported
    # systems (maintainer, 2026-10-12): each is installed, started and
    # signed in on every run. The job names are in smoke_gate.py too.
    name: windows (${{ matrix.os }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.source.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Download the bundles
        uses: actions/download-artifact@v7
        with:
          name: bundles-windows-x86_64
          path: bundles
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install silently, per user
        shell: pwsh
        run: |
          $setup = Get-ChildItem bundles/nsis/*.exe
          if (@($setup).Count -ne 1) { throw "Expected one NSIS installer, found $(@($setup).Count)." }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter 'openalgo-desktop.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "openalgo-desktop.exe was not found under $env:LOCALAPPDATA after the install." }
          Write-Host "Installed: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Windows version
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) $($os.Version), $(Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' InstallationType)"
      - name: Launch the installed app, create the account and sign in
        run: python scripts/ci/launch_smoke.py --first-sign-in --mcp-bridge "$APP_EXE"
      - name: MCP over piped stdio (installed GUI-subsystem executable)
        run: python scripts/ci/mcp_stdio_smoke.py "$APP_EXE"

  macos:
    name: macos (aarch64)
    needs: source
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.source.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Download the bundles
        uses: actions/download-artifact@v7
        with:
          name: bundles-macos-aarch64
          path: bundles
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Copy the app out of the .dmg
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(bundles/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg, found ${#dmgs[@]}."
            exit 1
          fi
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "${dmgs[0]}"
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          apps=("$mnt"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::Expected one app in the .dmg, found ${#apps[@]}."
            exit 1
          fi
          # As a trader drags it to Applications.
          ditto "${apps[0]}" "${RUNNER_TEMP}/Applications/$(basename "${apps[0]}")"
          bin="${RUNNER_TEMP}/Applications/$(basename "${apps[0]}")/Contents/MacOS/openalgo-desktop"
          test -x "$bin"
          echo "APP_BIN=${bin}" >> "$GITHUB_ENV"
      - name: Start the app (window and all), create the account and sign in
        # The runner's own home is kept (the runner is fresh, so the data
        # folder is empty). The app makes no keychain call (KEY-01): its keys
        # are locked with the password in openalgo.db.
        run: python3 scripts/ci/launch_smoke.py --first-sign-in --real-home --mcp-bridge "$APP_BIN"
      - name: MCP over piped stdio (installed binary)
        run: python3 scripts/ci/mcp_stdio_smoke.py "$APP_BIN"
