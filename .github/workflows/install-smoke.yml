name: Install smoke

# Installs the bundles a CI run built, starts the installed app with a fresh
# home and data folder, and waits until it serves its HTTP API; then checks
# the packaged binary's `mcp` subcommand over piped stdio, and the .deb's
# dependency list against what the binary links. A green CI run proves the
# code builds and its tests pass; this is the evidence that an installer
# installs and the installed app starts and signs a trader in.
#
#   Linux x64, Linux arm64  apt install ./<deb> on a fresh runner, start under
#                           Xvfb, create the account and sign in; the
#                           AppImage too (extract-and-run, no FUSE), start only
#   Windows Server 2022,    silent per-user NSIS install, start the installed
#   Windows Server 2025     app (a GUI-subsystem executable), create the
#                           account and sign in
#   macOS Apple Silicon     the app copied out of the .dmg, started with its
#                           window, account created and signed in; the
#                           Apple Silicon and Intel apps checked to start on
#                           the oldest macOS they claim (check_macos_min.py)
#
# "Sign in" is the trader's first start through the app's own HTTP on the
# shipped port: POST /setup, POST /auth/login, GET /auth/session-status,
# plus a wrong password that must be refused (scripts/ci/launch_smoke.py).
# No OS keychain is used on any system (KEY-01): session-status must say the
# keys are locked until the sign-in and open after it.
# The GUI start: once signed in, the app's request log must show its own
# window's GET of the page (launch_smoke.py --window), from WebKitGTK under
# Xvfb, WebView2 and WKWebView. Only the AppImage run is start-only.
# Every job also runs the packaged `mcp` subcommand over piped stdio: with
# no app (a closed port), and, after the sign-in, against the running app
# with a read-scope MCP token created on it (protocol versions, the read
# scope's tools and no order tool, an order refused for its scope, two
# calls, a token revoked midway; launch_smoke.py --mcp-bridge).
#
# A job of every CI run (ci.yml calls this workflow after tauri-build, and
# ci-ok needs it), so a pull request is tested installed before it merges,
# with the bundles, this workflow and these scripts all from the commit
# under test. Each job names that commit in its summary. release.yml refuses
# a tag unless the newest CI push run of that commit on master passed every
# job here (scripts/ci/smoke_gate.py release), and then ships that run's
# bundles (scripts/ci/release_bundles.py): the files installed here, and the
# Intel app and the macOS update bundles, which no job here starts. To try
# an older run's bundles again, re-run its jobs (the bundles are kept 7
# days), before tagging: a re-run after the gate makes the release refuse.
#
# The app binds the shipped ports 5000 and 8765 here, which is fine on a CI
# runner and is why scripts/ci/launch_smoke.py refuses to run outside CI.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-22.04
          - name: aarch64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/tested_commit.sh
      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles-linux-${{ matrix.name }}
          path: bundles
      - name: What the .deb depends on
        id: deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#debs[@]}."
            exit 1
          fi
          echo "depends=$(bash scripts/ci/deb_depends.sh "${debs[0]}")" >> "$GITHUB_OUTPUT"
      - name: Install Xvfb and the .deb's dependencies
        # The 27 MB WebKitGTK runtime among them, from cached package files
        # unless Ubuntu updated them since: a slow mirror held the native
        # E2E job's same download past its limit (apt-cached).
        uses: ./.github/actions/apt-cached
        with:
          name: install-smoke-runtime
          packages: xvfb ${{ steps.deb.outputs.depends }}
          minutes: "8"
      - name: Install the .deb (apt checks its Depends)
        # Its dependencies are installed above; nothing is left to download.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          sudo apt-get install -y --no-install-recommends "./${debs[0]}"
          dpkg -L open-algo-desktop | grep -E '^/usr/bin/'
      - name: The installed binary is not the E2E test build
        # src-tauri/src/e2e.rs: the test-only build signs in to a scripted
        # broker; a shipped binary carries none of its strings.
        run: python3 scripts/ci/check_no_e2e_build.py /usr/bin/openalgo-desktop
      - name: The .deb depends on what the binary links
        run: |
          shopt -s nullglob
          debs=(bundles/deb/*.deb)
          scripts/ci/check_deb.sh "${debs[0]}"
      - name: Start a display
        # Wait for the X server's socket: the app is launched in the next
        # step, and on the slower ARM runner it once started before Xvfb was
        # listening ("Failed to initialize GTK").
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          for _ in $(seq 1 100); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "::error::Xvfb did not start within 10 s."
            exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Launch the installed app, create the account and sign in
        run: python3 scripts/ci/launch_smoke.py --first-sign-in --window --mcp-bridge /usr/bin/openalgo-desktop
      - name: Launch the AppImage
        env:
          # No FUSE on the runner: the AppImage runtime extracts and runs.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(bundles/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage, found ${#images[@]}."
            exit 1
          fi
          chmod +x "${images[0]}"
          python3 scripts/ci/launch_smoke.py "$(realpath "${images[0]}")"
      - name: MCP over piped stdio (installed binary)
        run: python3 scripts/ci/mcp_stdio_smoke.py /usr/bin/openalgo-desktop

  windows:
    # Windows Server 2022 and 2025 with Desktop Experience are supported
    # systems (maintainer, 2026-10-12): each is installed, started and
    # signed in on every run. The job names are in smoke_gate.py too.
    name: windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/tested_commit.sh
      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles-windows-x86_64
          path: bundles
      - name: Install silently, per user
        shell: pwsh
        run: |
          $setup = Get-ChildItem bundles/nsis/*.exe
          if (@($setup).Count -ne 1) { throw "Expected one NSIS installer, found $(@($setup).Count)." }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter 'openalgo-desktop.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "openalgo-desktop.exe was not found under $env:LOCALAPPDATA after the install." }
          Write-Host "Installed: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The installed binary is not the E2E test build
        # src-tauri/src/e2e.rs: the test-only build opens a WebView2
        # debugging port and signs in to a scripted broker; a shipped binary
        # carries none of their strings.
        run: python scripts/ci/check_no_e2e_build.py "$APP_EXE"
      - name: The installed app needs only DLLs that Windows ships
        # The runner has the Visual C++ runtime a trader's PC may lack, so
        # the start below cannot show it is not needed; the import tables
        # can (scripts/ci/check_windows_dlls.py).
        run: python scripts/ci/check_windows_dlls.py "$APP_EXE"
      - name: Windows version
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) $($os.Version), $(Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' InstallationType)"
      - name: Launch the installed app, create the account and sign in
        # The runner's own profile (the runner is fresh): the app keeps its
        # data in the roaming AppData known folder, which the ACL check
        # below reads.
        run: python scripts/ci/launch_smoke.py --first-sign-in --real-home --window --mcp-bridge "$APP_EXE"
      - name: The data folder is private to this user
        # PLATFORM-04: the app sets no ACL of its own on Windows and relies
        # on the profile's inherited one; check it on this system, after
        # showing that the check fails on a folder open to Everyone.
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'acl-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          icacls $probe /grant '*S-1-1-0:(OI)(CI)R' | Out-Null
          pwsh -NoProfile -File scripts/ci/check_windows_acl.ps1 -Folder $probe
          if ($LASTEXITCODE -ne 1) { throw "The ACL check passed a folder open to Everyone." }
          pwsh -NoProfile -File scripts/ci/check_windows_acl.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: MCP over piped stdio (installed GUI-subsystem executable)
        run: python scripts/ci/mcp_stdio_smoke.py "$APP_EXE"

  macos:
    name: macos (aarch64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/tested_commit.sh
      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles-macos-aarch64
          path: bundles
      - name: Copy the app out of the .dmg
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(bundles/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg, found ${#dmgs[@]}."
            exit 1
          fi
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "${dmgs[0]}"
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          apps=("$mnt"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::Expected one app in the .dmg, found ${#apps[@]}."
            exit 1
          fi
          # As a trader drags it to Applications.
          ditto "${apps[0]}" "${RUNNER_TEMP}/Applications/$(basename "${apps[0]}")"
          bin="${RUNNER_TEMP}/Applications/$(basename "${apps[0]}")/Contents/MacOS/openalgo-desktop"
          test -x "$bin"
          echo "APP_BIN=${bin}" >> "$GITHUB_ENV"
      - name: The installed binary is not the E2E test build
        # src-tauri/src/e2e.rs: no shipped binary carries its strings.
        run: python3 scripts/ci/check_no_e2e_build.py "$APP_BIN"
      - name: Download the Intel bundle
        uses: actions/download-artifact@v8
        with:
          name: bundles-macos-x86_64
          path: bundles-x64
      - name: Both apps start on the oldest macOS they claim
        # PLATFORM-03: README "Supported systems" says macOS 10.15
        # (tauri.conf.json minimumSystemVersion); Apple Silicon starts at
        # 11.0. The Intel app is checked here though no Intel Mac runs it.
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(bundles-x64/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one Intel .dmg, found ${#dmgs[@]}."
            exit 1
          fi
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "${dmgs[0]}"
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          intel=("$mnt"/*.app)
          python3 scripts/ci/check_macos_min.py "$(dirname "$(dirname "$(dirname "$APP_BIN")")")" "${intel[0]}"
      - name: Start the app (window and all), create the account and sign in
        # The runner's own home is kept (the runner is fresh, so the data
        # folder is empty). The app makes no keychain call (KEY-01): its keys
        # are locked with the password in openalgo.db.
        run: python3 scripts/ci/launch_smoke.py --first-sign-in --real-home --window --mcp-bridge "$APP_BIN"
      - name: MCP over piped stdio (installed binary)
        run: python3 scripts/ci/mcp_stdio_smoke.py "$APP_BIN"
