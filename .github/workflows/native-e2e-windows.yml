name: Native E2E (Windows)

# The app driven through its own window on Windows Server 2025, against its
# real Rust server, sign-in and session cookie: account creation, a refused
# wrong password, sign-in, the signed-in shell and sign-out
# (scripts/ci/native_e2e.py, as the Linux run in native-e2e.yml does).
#
# msedgedriver reaches WebView2 through its remote debugging port, and
# WebView2 does not take that switch from the environment for an app that
# sets its own browser arguments, as Tauri does. So this workflow builds a
# test-only binary with the e2e-debug-port feature (src-tauri/src/e2e.rs):
# the main window opens the port the script gives it at start
# (OPENALGO_E2E_DEBUG_PORT, a free port per run), on 127.0.0.1 only, which
# the script checks. That build:
#   - exists only here: the feature does not compile without
#     OPENALGO_E2E_BUILD=1 outside a debug build, and release.yml never
#     sets either;
#   - is never shipped: the install smoke and release.yml check the shipped
#     Windows binary for its strings (scripts/ci/check_no_e2e_build.py),
#     and this job runs the same check on its own build to show it finds
#     them.
#
# Not part of ci-ok: it builds a second Windows release binary (39 minutes
# on 2026-10-20, run 39373651570: the release profile's LTO on the app
# itself dominates), so it runs after pushes to master and by hand only,
# newest first.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  NODE_VERSION: "22"

jobs:
  windows:
    name: native e2e (windows-2025, test build)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Commit under test
        run: bash scripts/ci/tested_commit.sh
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the frontend the binary embeds
        run: npx vite build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # The release dependencies tauri-build compiles for this target;
          # read them, never write the cache from this build.
          shared-key: tauri-build-windows-x86_64
          save-if: false
      - name: Build the E2E test binary (e2e-debug-port)
        working-directory: src-tauri
        env:
          OPENALGO_E2E_BUILD: "1"
        run: cargo build --release --locked --features e2e-debug-port --target x86_64-pc-windows-msvc
      - name: The string check finds the test build
        run: python scripts/ci/check_no_e2e_build.py src-tauri/target/x86_64-pc-windows-msvc/release/openalgo-desktop.exe --expect-e2e
      - name: The Edge WebDriver of the installed WebView2's version
        # msedgedriver must match the WebView2 runtime the app runs in.
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = $null
          foreach ($k in $keys) {
            if (Test-Path $k) { $version = (Get-ItemProperty -Path $k -Name pv -ErrorAction SilentlyContinue).pv }
            if ($version) { break }
          }
          if (-not $version) { throw "The WebView2 runtime version was not found in the registry." }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $driver = Get-ChildItem -Path $dir -Recurse -Filter 'msedgedriver.exe' | Select-Object -First 1
          if (-not $driver) { throw "msedgedriver.exe was not in the download." }
          "MSEDGEDRIVER=$($driver.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install selenium
        run: python -m pip install --user selenium==4.27.1
      - name: Set up, sign in and sign out in the app's window
        run: python scripts/ci/native_e2e.py src-tauri/target/x86_64-pc-windows-msvc/release/openalgo-desktop.exe
