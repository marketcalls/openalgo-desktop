# cargo-nextest configuration for CI, passed explicitly with
#   cargo nextest run --config-file ../.github/nextest.toml --profile ci
# so src-tauri/.config/nextest.toml (if a developer adds one) stays local.

[profile.ci]
# Run every test even after a failure, so one red OS shows the whole picture.
fail-fast = false
# No automatic retries: a flaky test is a bug to fix, not to hide.
retries = 0
# Flag tests slower than 60s and kill any test that runs past 5 minutes
# (a hung socket, keyring prompt or broker mock), instead of stalling the job.
slow-timeout = { period = "60s", terminate-after = 5 }
# Leaked child processes or handles are reported, not waited on forever.
leak-timeout = "500ms"
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"

# The security tests that drive hundreds to thousands of requests through
# the whole HTTP stack on purpose (floods, address rotation) are slow on the
# Windows runner: ten minutes for them, five for everything else.
[[profile.ci.overrides]]
filter = 'test(/availability_guarantees|every_surface_charges|rotating_through_our_own|full_limiter_never_refuses|tunnel_failures_never_refuse/)'
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
# Written to src-tauri/target/nextest/ci/junit.xml and uploaded by ci.yml.
path = "junit.xml"
store-success-output = false
store-failure-output = true
