# gitleaks configuration used by ci.yml (secret-scan) and security.yml.
#
# Starts from the upstream default rule set. The allowlist below holds only
# values that are known not to be secrets: fixture placeholders and fake keys
# used by tests. Never allowlist a real credential; rotate it and rewrite the
# fixture with the <APIKEY>, <USER_ID>, <EMAIL> placeholders instead.

title = "openalgo-desktop"

[extend]
useDefault = true

[[allowlists]]
description = "Fixture placeholders and fake test keys"
regexTarget = "match"
regexes = [
  # Placeholders required by CLAUDE.md for recorded fixtures.
  '''<APIKEY>''',
  '''<USER_ID>''',
  '''<EMAIL>''',
  '''<TOKEN>''',
  '''<SECRET>''',
  # Deliberately invalid API key used by the invalid-apikey contract fixture.
  '''invalidkey123''',
  # Fake 32-hex key used by the api_keys unit tests.
  '''abcdef0123456789abcdef0123456789''',
  # Playground message templates are keyed by name, e.g. key: 'subscribe_depth_20'.
  '''subscribe_[a-z0-9_]+''',
  # Fake JWTs in broker fixtures: a real-looking header and payload but a
  # literal placeholder signature ("sig", "signature", or "sig" base64
  # encoded as "c2ln"). A real token never has one of these as its signature.
  '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.(signature|sig|c2ln)\b''',
  # OpenAlgo option symbols passed next to an `auth` argument in tests.
  '''[A-Z]+[0-9]{2}[A-Z]{3}[0-9]{2}[0-9.]+(CE|PE)''',
  # Made-up Groww order id used by the adapter tests.
  '''GMK39038RDT490CCVRP''',
]

[[allowlists]]
description = "Argon2id known-answer vectors in the password hashing tests"
# Only these exact test values, and only in this file: two fixed test salts,
# and the PHC hash and key-vault key the reference implementation gives for
# the test password and pepper (security::hashing::tests). They protect
# nothing.
condition = "AND"
paths = ['''^src-tauri/src/security/hashing\.rs$''']
regexes = [
  '''^c29tZXNhbHRzb21lc2FsdA$''',
  '''^MTIzNDU2Nzg5MGFiY2RlZg$''',
  # The same salt as gitleaks decodes it from base64.
  '''^1234567890abcdef$''',
  '''^EOS7b0Gy28yNMM9Y3Eb0xS8WgPgz2iXnO87OMlG2usA$''',
  '''^aa11986f53323c413e6844bf08de8d0900cb42b5af9b3c88f960319d7d992e62$''',
]

[[allowlists]]
description = "Made-up credentials in the Agent redaction tests"
# Only these exact test values, and only in this file: the values the
# redaction tests (agent::redact::tests) prove are removed. Commit 6a6db49c
# wrote them as literals; the tests now assemble them at runtime, so only
# that commit's history needs this entry. They protect nothing.
condition = "AND"
paths = ['''^src-tauri/src/agent/redact\.rs$''']
regexes = [
  '''^a1b2c3d4e5f6$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJBQjEyMzQifQ\.c2lnbmF0dXJlLXZhbHVl$''',
  '''^Zm9vYmFyQmF6UXV4MTIzNDU2Nzg5MEFCQ0RFRkdISUpLTE1O$''',
  # The same value as gitleaks decodes it from base64.
  '''^foobarBazQux1234567890ABCDEFGHIJKLMN$''',
]
