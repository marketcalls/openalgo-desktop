# CodeQL configuration shared by every language in codeql.yml.
#
# Test code is excluded: integration tests, frontend unit tests and the
# Playwright suite use fixed keys, passwords and payloads on purpose, so the
# "hard-coded cryptographic value" and similar queries only produce noise
# there. Unit tests that live in their own files inside src-tauri/src
# (src-tauri/src/server/tests/ and every tests.rs) are excluded too: each is
# declared `#[cfg(test)] mod tests;` and never compiled into the app. Check
# that declaration before adding a path here. Inline #[cfg(test)] modules in
# other files cannot be excluded by path: move such a module into its own
# tests.rs beside the file (`foo.rs` declares `#[cfg(test)] mod tests;`, the
# body goes in `foo/tests.rs`), which closes its alerts at the next scan
# (security::hashing, 2026-10-22). Dismiss one as "used in tests" only where
# the module cannot move, after checking it really sits in a test module.
name: openalgo-desktop CodeQL config

paths-ignore:
  # Third-party crates kept as published (src-tauri/vendor/*/VENDORED.md),
  # with their own tests, examples and workflows; not our code to change.
  - src-tauri/vendor/**
  - src-tauri/tests/**
  - src-tauri/src/server/tests/**
  - "src-tauri/src/**/tests.rs"
  # Shared test kits, declared `#[cfg(test)] pub(crate) mod testkit;` and
  # never compiled into the app (checked 2026-10-31: agent/tools/testkit.rs).
  - "src-tauri/src/**/testkit.rs"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - e2e/**
