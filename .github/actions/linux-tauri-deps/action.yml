name: Linux Tauri 2 system dependencies
description: >
  Installs the system packages Tauri 2 needs to compile, test and bundle on
  Ubuntu 22.04 (x86_64 and aarch64). Kept in one place so every Linux job
  builds against the same WebKitGTK 4.1 / GTK 3 stack. The package files apt
  downloads are cached per runner image and package list (apt-cached), so a
  slow Ubuntu mirror only costs time for the packages it updated since.

runs:
  using: composite
  steps:
    - name: Install the packages, from cached package files where they match
      uses: ./.github/actions/apt-cached
      with:
        name: linux-tauri-deps
        # Tauri 2 prerequisites (https://v2.tauri.app/start/prerequisites/#linux)
        # plus what this app's crates link against:
        #   libdbus-1-dev, pkg-config  keyring (Linux Secret Service)
        #   libxdo-dev                 menu accelerators
        #   file, xdg-utils            AppImage bundling
        # libappindicator3-dev and libayatana-appindicator3-dev conflict on
        # 22.04; only libappindicator3-dev is installed (what tauri-action
        # documents).
        packages: >-
          build-essential curl wget file xdg-utils pkg-config patchelf
          libssl-dev libdbus-1-dev libxdo-dev libwebkit2gtk-4.1-dev
          libappindicator3-dev librsvg2-dev
