[package]
name = "openalgo-desktop"
version = "1.0.4"
description = "OpenAlgo Desktop - Algorithmic Trading Platform"
authors = ["OpenAlgo"]
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.99"

[lib]
name = "openalgo_desktop_lib"
# Desktop only: the cdylib and staticlib types Tauri adds for mobile targets
# cost a 600 MB static archive per build and are never used here.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Native confirmation for account reset (called from Rust only; no JS permission)
tauri-plugin-dialog = "2.8"
# In-app updates (crate::updater), driven from Rust only; no page is granted
# its commands. rustls only (the default `zip` feature is for the old v1
# Windows artifacts; `system-proxy` is not used by the app's other clients).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
# Version precedence for updates and the data-folder version check.
semver = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.0", features = ["bundled", "parquet"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
# r2d2's worker threads, built to end with their pool (db::sqlite::build_pool):
# by default each dropped pool kept its three until its next reaper run.
scheduled-thread-pool = "0.2.7"

# Security
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
# zeroize: the crate wipes its own intermediate hashes (H0, the final block).
argon2 = { version = "0.5", features = ["zeroize"] }
aes-gcm = "0.10"
# The AES key schedule is zeroed when the data key leaves memory at logout
# (KEY-01).
aes = { version = "0.8", features = ["zeroize"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
data-encoding = "2.6"
hex = "0.4"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
png = "0.17"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "http2"], default-features = false }
# The HTTP/2 crate reqwest uses, named only to read a failed order
# request's HTTP/2 error code (brokers::common::outcome::after_send).
h2 = "0.4.16"
# The Agent's model providers (OpenAI chat and Responses, Anthropic, Gemini,
# Ollama, OpenAI-compatible), pinned exactly, with no TLS of its own: the
# Agent hands it a reqwest 0.13 client built here (rustls on ring, the
# webpki roots), so no aws-lc and no OpenSSL reach the tree. The Agent's
# client is its own, never the broker one: a turn may stream for 900 s.
genai = { version = "=0.7.1", default-features = false }
reqwest_agent = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream"] }

# HTTP server
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path", "limit", "set-header"] }
socketioxide = { version = "0.17", features = ["state"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Binary parsing
byteorder = "1.5"
# Protobuf market-data feeds (Upstox V3, Groww); message types are checked
# in (no protoc at build time).
prost = "0.14"
# Gzip master contracts (Upstox).
flate2 = "1"
# NATS nkey signatures for the Groww feed.
ed25519-dalek = "2"
# MQTT 3.1.1 market and order feeds (IIFL Capital). Pure Rust; built with
# no bundled crypto provider and handed a ring-backed rustls config, so it
# adds no C toolchain needs beyond what reqwest already has (Linux aarch64).
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# The built-in ngrok tunnel (services::tunnel), in process: nothing for the
# trader to install. ngrok's official SDK (MIT OR Apache-2.0), pinned
# exactly; rustls on ring like every other client here (its default
# aws-lc-rs would add a second crypto provider, and rustls cannot pick a
# default when both are built). It verifies ngrok's own CA, bundled in the
# crate, not the system's roots.
ngrok = { version = "=0.19.0", default-features = false, features = ["ring"] }
# Serving the tunnel's connections with the app's own router, as axum
# serves the listener (`server::tunnel`); both already in the tree via axum.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_path_to_error = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Exact decimal money (sandbox engine)
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rust_decimal_macros = "1"

# Concurrency
parking_lot = "0.12"
dashmap = "6.0"

# Async trait
async-trait = "0.1"

# URL parsing
url = "2.5"
# Secret-shaped text in Agent tool results and service messages
# (agent::redact, agent::tools::service), as the web's patterns.
regex = "1"
urlencoding = "2.1"

# UUID generation
uuid = { version = "1.8", features = ["v4"] }

# WhatsApp (pairing, Signal sessions, send/receive). Pinned commit of the
# crate the web's `wars` package wraps. Default features are off: its SQLite
# store links a different libsqlite3 than rusqlite (Cargo forbids two crates
# with the same `links` key), so the session lives in an in-memory store whose
# snapshot is AES-GCM encrypted into openalgo.db; the HTTP client is ours.
whatsapp-rust = { git = "https://github.com/marketcalls/whatsapp-rust", rev = "d8de9f4564537a77009b1f3d2b19a2702d94a6e3", default-features = false, features = ["tokio-runtime", "tokio-transport"] }

bytes = "1"

# 8x8 bitmap font for the Telegram chart PNGs (no system fonts needed).
font8x8 = { version = "0.3", default-features = false }

# openalgo.ta's Rust core (MIT, no dependencies): the indicator kernels the
# Agent computes with. Pinned to the commit of tag v2.0.5 of
# marketcalls/openalgo-python-library, the openalgo release the web pins in
# its uv.lock, so the numbers are the web's. Read-only use: the maintainer
# owns that repository; a new pin follows the web's openalgo upgrade.
oa_core = { git = "https://github.com/marketcalls/openalgo-python-library", rev = "9e9f294c5a07ad335b23a1f667cb1b547a2e9f07" }

# MCP (Model Context Protocol): the stdio transport of `openalgo-desktop mcp`.
# Server side only, over tokio stdio; no HTTP or auth features (the `/mcp`
# HTTP transport is served by axum in `crate::mcp::http`).
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }

# Process and host metrics (health monitor, diagnostics)
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "network"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Argon2's working memory in pages of its own on glibc, returned when a run
# ends (security::hashing::Workspace). 0.9.11: RUSTSEC-2026-0186.
memmap2 = "0.9.11"
# malloc_trim: freed heap pages given back once a minute (services::heap).
libc = "0.2"
# The main window's WebKitGTK settings for voice (microphone and WebRTC):
# the version wry pins, already built for the window.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Thread count for the health monitor (proc_pidinfo).
libc = "0.2"

# The update plugin's tests (crate::updater::plugin_tests) run on Tauri's
# mock runtime, off Windows only: an app built on it links window code that
# needs the common-controls v6 manifest, which test executables lack there.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Minisign prehashes with BLAKE2b-512: those tests sign with a key pair made
# in the test, as the Tauri CLI signs a release.
blake2 = "0.10"

[target.'cfg(unix)'.dev-dependencies]
# close(2) in the integration-test child isolation (tests/it/isolate.rs).
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
# Reads a JSON object's keys in the order written (serde_json maps sort).
indexmap = { version = "2", features = ["serde"] }
proptest = "1"
tokio = { version = "1", features = ["full", "test-util"] }
# Integration tests in tests/ use the scriptable broker (brokers::mock).
openalgo-desktop = { path = ".", default-features = false, features = ["test-support"] }

[features]
default = ["custom-protocol", "runner-window"]
custom-protocol = ["tauri/custom-protocol"]
# The OpenScript runner's hidden Tauri window (the app's runner host). Off,
# runs are refused with a sentence; tests drive the runner with a fake host.
runner-window = []
# Exposes brokers::mock (MockBroker, MockFeed) to integration test crates.
test-support = []
# CI's native E2E test build only (src/e2e.rs). Neither builds without
# OPENALGO_E2E_BUILD=1 outside a debug build (build.rs); never in a release.
# Windows: the main window's WebView2 opens a debugging port.
e2e-debug-port = []
# A scripted broker (src/brokers/scripted.rs) in the place of Dhan (Sandbox).
e2e-broker = ["test-support"]

# The real server for the Flow end-to-end journeys (examples/e2e_server.rs,
# CI's e2e-flow job): only with the scripted broker, so never in a release.
[[example]]
name = "e2e_server"
required-features = ["e2e-broker"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# CI's native E2E test build (.github/workflows/native-e2e-test-build.yml):
# a release build (no debug assertions, the shipped ports) without the
# link-time optimization that takes most of a release build's time. Never
# shipped.
[profile.e2e]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 1

# Dependencies without debug info keep target/ small (DuckDB alone is large).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing optimized in debug and test builds too: unoptimized, one
# Argon2 run (19 MiB, two passes) takes about 0.5 s instead of 30 ms, and the
# sign-in and key-vault tests run hundreds, so the slowest of them came
# within reach of CI's five-minute limit on Windows. Release is unchanged.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.zeroize]
opt-level = 3

# genai 0.7.1 as published, without serde_json's `preserve_order` feature,
# which it would otherwise turn on for the whole build and so change the key
# order of every JSON map in the app (vendor/genai-0.7.1/VENDORED.md). The
# folder is not a member of this crate's workspace, so our clippy, tests and
# code-health checks never treat it as our code.
[patch.crates-io]
genai = { path = "vendor/genai-0.7.1" }
