[package]
name = "openalgo-desktop"
version = "1.0.0"
description = "OpenAlgo Desktop - Algorithmic Trading Platform"
authors = ["OpenAlgo"]
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.92"

[lib]
name = "openalgo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Security
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
argon2 = "0.5"
aes-gcm = "0.11"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
data-encoding = "2.6"
hex = "0.4"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
png = "0.17"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTTP server
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path", "limit", "set-header"] }
socketioxide = { version = "0.17", features = ["state"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Binary parsing
byteorder = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_path_to_error = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6.0"

# Async trait
async-trait = "0.1"

# URL parsing
url = "2.5"
urlencoding = "2.1"

# UUID generation
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dependencies without debug info keep target/ small (DuckDB alone is large).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
